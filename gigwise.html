<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gigwise – Hire and get hired, matched by AI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--sf:#fff;--sk:#efebe2;--ink:#15181e;--mut:#5d6572;--ln:#ddd8cb;--ac:#0b8a5f;--ac2:#086e4c;--acl:#e3f4ec;--wn:#9a5600;--wl:#fdf1dc;--rk:#b3261e;--rl:#fbe7e5;--bl:#2457c5;--bll:#e6eefc;--on:#fff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--sf:#171c23;--sk:#0b0e12;--ink:#ece9e1;--mut:#a0a9b5;--ln:#2c343f;--ac:#3fcfa0;--ac2:#62e0b9;--acl:#12332a;--wn:#f2b450;--wl:#33280f;--rk:#ff8e84;--rl:#3a1a18;--bl:#8fb1ff;--bll:#17223a;--on:#042018}}
:root[data-theme="dark"]{--bg:#0f1318;--sf:#171c23;--sk:#0b0e12;--ink:#ece9e1;--mut:#a0a9b5;--ln:#2c343f;--ac:#3fcfa0;--ac2:#62e0b9;--acl:#12332a;--wn:#f2b450;--wl:#33280f;--rk:#ff8e84;--rl:#3a1a18;--bl:#8fb1ff;--bll:#17223a;--on:#042018}
*{box-sizing:border-box}html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}

p{margin:0}a{color:inherit;cursor:pointer}button{font:inherit;color:inherit}
.lead{color:var(--mut);font-size:17px;margin-top:6px}.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--ac2);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:6px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.top>div{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}

.dnav svg{width:18px;height:18px}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px}

.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--mut);text-decoration:none}.tabbar a.on{color:var(--ac2)}.tabbar a.post svg{background:var(--ac);color:var(--on);border-radius:10px;padding:3px;width:28px;height:28px}
.dnav a{white-space:nowrap}@media(max-width:1140px){.dnav svg{display:none}.dnav a{padding:9px 10px}.who span.t{display:none}.who{padding:4px}}

/* layout */
.wrap{max-width:1040px;margin:0 auto;padding:30px 20px 70px}.narrow{max-width:720px}
.g2{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);margin-top:22px}@media(min-width:900px){.g2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:22px;margin-bottom:20px}.card>h2{margin-bottom:14px}

.btn svg{width:18px;height:18px}.btn.gh{background:var(--sf);color:var(--ink);border-color:var(--ln)}.btn.gh:hover{background:var(--sk)}.btn.dn{background:var(--sf);color:var(--rk);border-color:var(--ln)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px}.btn.lg{min-height:54px;padding:14px 26px;font-size:16px}.btn.full{width:100%}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ac);flex:none}
.irow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.irow>input{flex:1}
.xb{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;color:var(--mut)}
.money{position:relative}.money:before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}.money input{padding-left:28px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--ln);padding:3px 11px;font-size:13px;background:var(--sf);white-space:nowrap}
.chip.a{background:var(--acl);border-color:transparent;color:var(--ac2)}.chip.w{background:var(--wl);border-color:transparent;color:var(--wn)}.chip.r{background:var(--rl);border-color:transparent;color:var(--rk)}.chip.b{background:var(--bll);border-color:transparent;color:var(--bl)}
.chip button{background:none;border:0;padding:0 0 0 2px;cursor:pointer;color:inherit;opacity:.7;font-size:14px}
.ml{font-weight:700}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.pills button{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;color:var(--mut)}.pills button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pills button em{font-style:normal;background:var(--rk);color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts button{border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:10px 16px;font-weight:500;cursor:pointer;min-height:46px}.opts button.on{border-color:var(--ac);background:var(--acl);color:var(--ac2);font-weight:600}

.av{width:46px;height:46px;border-radius:50%;background:var(--acl);color:var(--ac2);display:grid;place-items:center;font-weight:700;flex:none;border:1px solid var(--ln)}.av.lg{width:68px;height:68px;font-size:22px}.av.c{background:var(--bll);color:var(--bl)}
.jc{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}.jc:hover{border-color:var(--ac);box-shadow:0 4px 18px #0000000d}

.person{display:flex;gap:12px;align-items:center}.person>div{flex:1;min-width:0}
.todo{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--ln);flex-wrap:wrap}.todo:first-of-type{border-top:0;padding-top:0}.todo>div{flex:1;min-width:200px}.todo .ic{width:40px;height:40px;border-radius:12px;background:var(--wl);display:grid;place-items:center;font-size:18px;flex:none}
.empty{color:var(--mut);padding:8px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}.kv:first-of-type{border-top:0}.kv b{font-weight:600}
.big{font:400 42px/1.05 var(--fd)}
.box{background:var(--sk);border-radius:12px;padding:14px 16px;margin-top:12px}.box p+p{margin-top:4px}
.fit{list-style:none;padding:0;margin:10px 0 0}.fit li{padding:5px 0 5px 30px;position:relative}.fit li:before{position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.fit li.ok:before{content:"✓";background:var(--acl);color:var(--ac2)}.fit li.warn:before{content:"!";background:var(--wl);color:var(--wn)}
.steps{margin:0;padding-left:22px}.steps li{padding:5px 0}
/* next step banner */
.next{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--acl);border-radius:var(--r);padding:16px 18px;margin:18px 0}.next.w{background:var(--wl)}.next.b{background:var(--bll)}

.demo{margin-top:12px;font-size:14px;border:1px dashed var(--wn);border-radius:12px;padding:10px 14px;background:var(--sf)}.demo b{color:var(--wn);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
/* progress */
.prog{display:flex;gap:4px;margin-top:12px}.prog span{flex:1;font-size:11px;color:var(--mut);padding-top:9px;position:relative;font-weight:600}.prog span:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:9px;background:var(--sk)}.prog span.d:before{background:var(--ac)}.prog span.c{color:var(--ink)}.prog span.c:before{background:linear-gradient(90deg,var(--ac) 50%,var(--sk) 50%)}
@media(max-width:520px){.prog span{font-size:0}}
.bar{height:8px;border-radius:9px;background:var(--sk);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.track{list-style:none;padding:0;margin:14px 0 0}.track li{position:relative;padding:0 0 18px 34px;color:var(--mut)}.track li:before{content:"";position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--ln);background:var(--sf)}.track li:after{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:2px;background:var(--ln)}.track li:last-child:after{display:none}
.track li.d{color:var(--ink)}.track li.d:before{background:var(--ac);border-color:var(--ac);content:"✓";color:var(--on);font-size:12px;display:grid;place-items:center;font-weight:700}.track li.c{color:var(--ink);font-weight:600}.track li.c:before{border-color:var(--ac);box-shadow:0 0 0 4px var(--acl)}
/* parts (milestones) */
.part{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--ln)}.part:first-of-type{border-top:0;padding-top:0}.part>div{flex:1;min-width:0}
.pn{width:34px;height:34px;border-radius:50%;background:var(--sk);color:var(--mut);display:grid;place-items:center;font-weight:700;flex:none}.pn.ok{background:var(--ac);color:var(--on)}.pn.wt{background:var(--wl);color:var(--wn)}
.pt{display:flex;justify-content:space-between;gap:10px}
/* hero & welcome */
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:20px;padding:26px 28px;margin-top:22px}.hero p{opacity:.8;margin-top:6px;max-width:520px}.hero h2{color:var(--bg)}
.choose{display:grid;gap:18px;grid-template-columns:1fr;margin-top:30px}@media(min-width:760px){.choose{grid-template-columns:1fr 1fr}}
.choice{background:var(--sf);border:2px solid var(--ln);border-radius:22px;padding:28px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}.choice:hover{border-color:var(--ac);transform:translateY(-2px)}.choice .e{font-size:38px}.choice ul{margin:4px 0 0;padding-left:20px;color:var(--mut)}
.trio{display:grid;gap:16px;grid-template-columns:1fr;margin-top:34px}@media(min-width:760px){.trio{grid-template-columns:repeat(3,1fr)}}
.trio div{padding:4px 0}.trio b{display:block;margin:6px 0 2px}
/* wizard */
.wz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;font-weight:600;font-size:14px;color:var(--mut)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:20px}@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;text-align:left;min-height:58px}.tile span{font-size:22px}.tile.on{border-color:var(--ac);background:var(--acl);color:var(--ac2);box-shadow:0 0 0 1px var(--ac)}
.tier{width:100%;display:flex;gap:14px;align-items:center;border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;text-align:left}.tier.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac);background:var(--acl)}
.tier .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--ln);flex:none}.tier.on .rd{border:7px solid var(--ac)}.tier>div{flex:1}.tier .amt{font:400 26px var(--fd)}
.rec{font-size:12px;font-weight:700;color:var(--ac2);background:var(--sf);border-radius:999px;padding:2px 8px;margin-left:6px;border:1px solid var(--ac);white-space:nowrap;display:inline-block}
.wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.ai{display:flex;align-items:center;gap:14px;padding:40px 0;justify-content:center}.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--acl);border-top-color:var(--ac);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px;margin-top:16px}
/* sticky apply bar (mobile) */
.stick{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;display:none;gap:10px;box-shadow:0 8px 24px #0002;margin-top:10px}
@media(max-width:820px){.stick{display:flex}.stick .btn{flex:1}.hide-m{display:none}}

.mlay{display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);overflow:hidden;min-height:520px;margin-top:20px}@media(min-width:821px){.mlay{grid-template-columns:320px minmax(0,1fr)}}
.ml-list{border-right:1px solid var(--ln);overflow:auto;max-height:70vh}.ml-list a{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--ln);text-decoration:none;cursor:pointer}.ml-list a.on{background:var(--acl)}.ml-list a>div{min-width:0;flex:1}.ml-list p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;min-height:520px}.th-h{padding:14px 18px;border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:center}.th-b{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:55vh}

.th-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--ln)}
@media(max-width:820px){.mlay.has .ml-list{display:none}.mlay:not(.has) .thread{display:none}.ml-list{border-right:0;max-height:none}}
/* overlays */

:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--grid:#e1e0d9;--axis:#c3c2b7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#2c2c2a;--axis:#383835}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--grid:#2c2c2a;--axis:#383835}
.ch{position:relative;margin:16px 0 0 44px}
.ch-g{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}.ch-g.b{border-top-color:var(--axis)}.ch-g span{position:absolute;left:-46px;top:-9px;width:40px;text-align:right;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}

function contract(p){if(isH(p))return hourlyView(p);const C=S.role=="client",i=fi(p.hired),f=F[i],tot=p.ms.reduce((a,m)=>a+m.amt,0),paid=p.ms.filter(m=>m.st=="approved").reduce((a,m)=>a+m.amt,0),cur=p.ms.findIndex(m=>m.st!="approved"),fn=first(f.n);

 const rvl=(t,r)=>`<div class="box"><b>${t}</b><p>${r?`<span style="color:#e8a317">${"★".repeat(r.s)}</span>${"☆".repeat(5-r.s)} “${esc(r.t)}”`:'<span class="mut">Not written yet</span>'}</p></div>`;

 <div><section class="card"><h2>${C?"Safe Pay":"Your earnings"}</h2><div class="bar" style="margin-bottom:12px"><i style="width:${tot?paid/tot*100:0}%"></i></div>${C?kv("Paid",$$(paid))+kv("Still held safely",$$(tot-paid)):kv("Paid to you (after 10% fee)",$$(paid*(1-FFEE)))+kv("Waiting in Safe Pay",$$(tot-paid))}</section>

function subSheet(pid,k){const p=getP(pid),m=p.ms[k];S.sub={files:[]};sheet(`<h2>Send part ${k+1}</h2><p class="mut">“${esc(m.name)}” · ${$$(m.amt)} is paid when ${esc(p.client)} approves it.</p>${m.fb?`<div class="box" style="background:var(--wl)"><b>They asked for:</b> ${esc(m.fb)}</div>`:""}<label class="f" for="sn">What are you sending?</label><textarea id="sn">${esc(DLV[Math.min(k,2)][0])}${m.fb?" I’ve made the changes you asked for.":""}</textarea><label class="f" for="sf">Attach files (optional)</label><input id="sf" type="file" multiple onchange="S.sub.files=[...this.files].map(f=>f.name)"><div class="btns"><button class="btn lg full" onclick="submitMs(${pid},${k})">Send to client</button></div>`)}
