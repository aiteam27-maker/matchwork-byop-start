<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>/* night/day mode: saved choice, else the device setting; set before paint to avoid a flash */try{var t=localStorage.getItem("gigwise-theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>Gigwise</title>
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#1f2124;--mute:#62666d;--line:#e4e5e7;--soft:#f3f4f5;--brand:#0e7c66;--brand-d:#0a5e4e;--brand-l:#e2f3ee;--blue:#2f6fd1;--blue-l:#e6efff;--amber:#a86512;--amber-l:#fdf1dc;--red:#b42318;--red-l:#fde8e6;--gray:#8a918d;--r:8px;--sh:none;--ink2:#3d4045;--surface2:#f8f9fa;--line2:#d0d3d7;--track:#e6ebe8;--brand-h:#0a5e4e;--brand-b:#a9d6c9;--brand-t:#0c4f42;--amber-b:#f1d6a6;--amber-t:#6b4208;--blue-b:#c9dafb;--blue-t:#1d4a91;--best:#f1faf6;--red-b:#f0c4bf;--purple:#6b3fc4;--purple-l:#f1eaff;--purple-b:#d9c9fb;--purple-t:#4b2a91;--sky:#1569a8;--sky-l:#e5f4ff;--soft2:#eceef0;--t3:#b7791f;--hdr:rgba(255,255,255,.94);--cta:#16211c;--toast:#16211c;--star-off:#d6dbd8;--btn:#0e7c66;color-scheme:light}
:root[data-theme="dark"]{--bg:#0e1411;--card:#161e1a;--surface2:#121915;--ink:#e4ebe7;--ink2:#c2ccc7;--mute:#94a19b;--line:#28332e;--line2:#3a4741;--soft:#1e2823;--soft2:#25302a;--track:#2c3732;--brand:#1f9e7f;--btn:#167a62;--brand-h:#1b8d71;--brand-d:#8fe0c7;--brand-l:#15352c;--brand-b:#2b6b5a;--brand-t:#b4ecdc;--blue:#79aaf7;--blue-l:#17253b;--blue-b:#2d4670;--blue-t:#c1d6fb;--amber:#e5a85a;--amber-l:#352813;--amber-b:#5c4520;--amber-t:#f3d6a6;--red:#f2857a;--red-l:#3a1c19;--red-b:#6b302a;--gray:#7f8c86;--best:#14302a;--purple:#c0a6ff;--purple-l:#261e3b;--purple-b:#4a3a78;--purple-t:#dccdff;--sky:#83c8f5;--sky-l:#132736;--t3:#e0a84a;--hdr:rgba(22,30,26,.94);--cta:#0a0f0d;--toast:#2c3a34;--star-off:#3a4741;--sh:none;color-scheme:dark}
:root[data-theme="dark"] .cta{border:1px solid var(--line)}
:root[data-theme="dark"] .spill i{color:#0e1411}
:root[data-theme="dark"] #toast{border:1px solid var(--line2)}
:root[data-theme="dark"] .hero-q input::placeholder,:root[data-theme="dark"] input::placeholder,:root[data-theme="dark"] textarea::placeholder{color:#7d8984}
html{transition:background-color .2s}body,.card,#hdr,footer{transition:background-color .2s,border-color .2s,color .2s}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:21px}h3{font-size:16px}
p{margin:0 0 .8em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}
.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.between{justify-content:space-between}
.grow{flex:1}
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:#fff;font:inherit;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,transform .05s}
.btn:hover{background:var(--brand-h)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--brand)}.btn.ghost:hover{background:var(--brand-l)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}.btn.plain:hover{background:var(--soft)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--card);border-color:var(--red-b);color:var(--red)}.btn.danger:hover{background:var(--red-l)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;font:inherit;color:var(--brand);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--brand-l);color:var(--brand-d)}
.chip.miss{background:var(--card);border:1px dashed var(--red-b);color:var(--red)}
.chip.tag{background:var(--blue-l);color:var(--blue)}
.chip.warn{background:var(--amber-l);color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.st-submitted{background:var(--soft);color:var(--ink2)}.st-shortlisted{background:var(--blue-l);color:var(--blue)}.st-accepted{background:var(--brand-l);color:var(--brand-d)}.st-declined{background:var(--red-l);color:var(--red)}
.t1{--c:var(--brand)}.t2{--c:var(--blue)}.t3{--c:var(--t3)}.t4{--c:var(--gray)}
.tierlbl{font-size:12px;font-weight:700;color:var(--c)}
.ring{--s:56px;width:var(--s);height:var(--s);border-radius:50%;background:none;display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-weight:800;font-size:17px;color:var(--ink)}
.ring.sm{--s:42px}.ring.sm span{font-size:14px}.ring.sm::before{inset:4px}
.spill{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.spill i{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
input,textarea,select{font:inherit;color:inherit;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:var(--card);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-b);border-color:var(--brand)}
textarea{resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
label input,label textarea,label select{margin-top:6px;font-weight:400}
.lbl{font-weight:600;font-size:14px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.hint{font-size:13px;color:var(--mute);background:var(--soft);border-radius:10px;padding:9px 12px;margin-bottom:14px}
.hint b{color:var(--ink)}
/* header */
#hdr{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--ink);letter-spacing:-.02em}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a,.nav button{padding:7px 12px;border-radius:8px;color:var(--ink2);font-weight:500;white-space:nowrap;background:none;border:0;font:inherit;cursor:pointer}
.nav a:hover,.nav button:hover{background:var(--soft)}
.nav a.on{color:var(--brand-d);background:var(--brand-l);font-weight:600}
.hdr-r{display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);background:var(--card)}
.icon-btn:hover{background:var(--soft)}
.badge{position:absolute;top:-4px;right:-4px;background:#e0412f;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:4px 11px;font-size:13px}
.who{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px 3px 3px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
main{min-height:calc(100vh - 140px);padding-bottom:40px}
.page{padding-top:28px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph p{margin:0}
/* landing */
.hero{padding:44px 0 36px}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:44px;letter-spacing:-.03em;margin:18px 0 14px}
.lead{font-size:18px;color:var(--ink2);max-width:540px}
.hero-q{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--sh);max-width:560px;margin-top:22px}
.hero-q input{border:0;border-radius:999px}
.hero-q input:focus{outline:none}
.try{margin-top:12px;font-size:13px;color:var(--mute)}
.try .link{font-weight:500}
.sample{position:relative}
.sample .card{padding:18px}
.sample .back{position:absolute;inset:18px -10px -14px 18px;background:var(--brand-l);border-radius:var(--r);z-index:-1}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:10px 0 50px}
.strip div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.strip b{display:block;font-size:24px;letter-spacing:-.02em}
.sec{margin:56px 0}
.sec-h{text-align:center;max-width:640px;margin:0 auto 26px}
.sec-h p{color:var(--mute);font-size:16px}
.how{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.weights{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.w-row{display:grid;grid-template-columns:170px 1fr 44px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.w-row:first-child{border-top:0}
.w-bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.w-bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.guard li{margin-bottom:8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;font:inherit;transition:border-color .15s,box-shadow .15s}
.cat:hover{border-color:var(--brand);box-shadow:var(--sh)}
.cat b{display:block;font-size:16px}
.cta{background:var(--cta);color:#fff;border-radius:20px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h2{color:#fff;font-size:26px}
.cta p{color:#c4cec9;margin:0}
/* cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.fcard{display:flex;flex-direction:column;gap:10px}
.fcard .top{display:flex;gap:12px;align-items:center}
.fcard .bio{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
.meta b{color:var(--ink)}
.star{color:#d08a00}
.avail{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--brand-d);font-weight:600}
.avail::before{content:"";width:7px;height:7px;border-radius:50%;background:#1aa37f}
.avail.no{color:var(--gray)}.avail.no::before{background:var(--line2)}
/* matches */
.mlayout{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:14px}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px 16px;align-items:start;position:relative}
.mcard .rank{position:absolute;top:-9px;left:16px;background:var(--toast);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.mcard.top1{border-color:var(--brand-b);box-shadow:0 0 0 3px var(--brand-l),var(--sh)}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.mhead h3{margin:0}
.reason{margin:8px 0 10px;font-size:14.5px;color:var(--ink2)}
.mscore{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px}
.mact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.bd{grid-column:1/-1;background:var(--soft);border-radius:12px;padding:12px 14px}
.bd-row{display:grid;grid-template-columns:1fr 160px 70px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.bd-row:first-child{border-top:0}
.bar{height:8px;background:var(--track);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bd-pts{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bd-tot{text-align:right;padding-top:8px;border-top:1px solid var(--line2);margin-top:4px}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
.banner{display:flex;gap:12px;align-items:center;background:var(--brand-l);border:1px solid var(--brand-b);color:var(--brand-t);border-radius:12px;padding:11px 14px;margin-bottom:16px;flex-wrap:wrap}
.banner.amber{background:var(--amber-l);border-color:var(--amber-b);color:var(--amber-t)}
.banner.blue{background:var(--blue-l);border-color:var(--blue-b);color:var(--blue-t)}
.psum{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
/* jobs */
.jcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s}
.jcard:hover{border-color:var(--brand-b)}
.jcard .desc{font-size:14px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.jlist{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input{max-width:340px}
.toolbar select{width:auto}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:var(--surface2);font-weight:600}
tr:last-child td{border-bottom:0}
td.best{background:var(--best)}
.best-tag{display:block;font-size:11px;font-weight:700;color:var(--brand-d)}
tr.declined td{opacity:.55}
.cover{font-size:13px;color:var(--ink2);width:260px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cmp td:first-child{min-width:190px}.cmp td{white-space:normal}.cmp .nw{white-space:nowrap}
/* chat */
.chat{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 160px);min-height:460px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tlist{border-right:1px solid var(--line);overflow-y:auto}
.titem{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;color:inherit}
.titem:hover{background:var(--soft)}.titem.on{background:var(--brand-l)}
.titem .tx{min-width:0;flex:1}
.titem .last{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:#e0412f;flex:none;margin-top:6px}
.conv{display:flex;flex-direction:column;min-width:0}
.conv-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.msg{max-width:72%;padding:9px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:14.5px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--btn);color:#fff;border-color:var(--btn);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;border-bottom-left-radius:5px}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.msg.sys{align-self:center;background:none;border:0;color:var(--mute);font-size:12.5px;text-align:center;max-width:90%}
.typing{align-self:flex-start;color:var(--mute);font-size:13px;font-style:italic}
.chat-back{display:none;font-size:20px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{min-height:42px;max-height:120px}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty h3{color:var(--ink)}
/* profile */
.prof{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.port{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.port div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2)}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.skillbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:6px 8px;background:var(--card);cursor:text;margin-bottom:8px}
.skillbox input{border:0;padding:4px;flex:1;min-width:160px;width:auto}
.skillbox input:focus{outline:none}
.skillbox .chip button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:inherit;font-size:14px;line-height:1}
.detected{font-size:13px;margin-bottom:14px;min-height:4px}
.dash{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.dash>*,.prof>*,.mlayout>*{min-width:0}
.secttl{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.secttl:first-child{margin-top:0}
.secttl h2{margin:0}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(14,22,18,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet.open{display:flex}
.sheet-body{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.x{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolecard{border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:var(--card);text-align:left;font:inherit}
.rolecard:hover{border-color:var(--brand);background:var(--surface2)}
.rolecard b{display:block;font-size:16px;margin:8px 0 4px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;background:var(--card);font:inherit;text-align:left;width:100%}
.pitem:hover{border-color:var(--brand)}

 --gray:var(--mute);--t3:var(--ink2);--best:var(--surface2);--hdr:var(--paper);--cta:var(--ink);--toast:var(--ink);--star-off:var(--line2);--r:0;--sh:none}
:root[data-theme="dark"]{

 --acc:#e07656;--acc-ink:#f0957a;
 --bg:var(--paper);--brand:var(--acc);--brand-h:var(--acc);--brand-d:var(--ink);--brand-t:var(--ink);--brand-l:var(--soft);--brand-b:var(--line2);--btn:var(--ink);
 --blue:var(--ink2);--blue-l:var(--soft);--blue-b:var(--line);--blue-t:var(--ink);--amber:var(--acc);--amber-l:var(--soft);--amber-b:var(--line);--amber-t:var(--ink);
 --red:var(--acc);--red-l:var(--soft);--red-b:var(--line2);--purple:var(--ink);--purple-l:var(--soft);--purple-b:var(--line);--purple-t:var(--ink);--sky:var(--ink2);--sky-l:var(--soft);
 --gray:var(--mute);--t3:var(--ink2);--best:var(--surface2);--hdr:var(--paper);--cta:var(--ink);--toast:var(--ink);--star-off:var(--line2)}

.nav{gap:2px}
.nav a,.nav button{font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid transparent;padding:0 11px}
.nav a.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.nav a:hover,.nav button:hover{color:var(--acc)}
.icon-btn{border-radius:0}.icon-btn:hover{background:transparent;color:var(--acc)}
.seg{border-radius:0;background:transparent;border:1px solid var(--ink);padding:0}
.seg button{border-radius:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:6px 13px}
.seg button.on{background:var(--ink);color:var(--paper);box-shadow:none}
.seg.sm button{padding:4px 10px;font-size:11px}
.who{border-radius:0;background:transparent;border-color:var(--line2);padding:2px 10px 2px 2px}
/* page headers read like section openers */
.page{padding-top:40px}
.ph{border-bottom:1px solid var(--ink);padding-bottom:18px;margin-bottom:28px;align-items:flex-end}
.ph h1{margin:0 0 6px}
.ph p{font-family:var(--serif);font-style:italic;font-size:17px}
.secttl{border-bottom:1px solid var(--ink);padding-bottom:8px;margin:40px 0 0}
.secttl h2{font-size:24px}
.tabs{border-bottom:1px solid var(--line)}
.tabs button{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;border-bottom-width:1px}
.tabs button.on{border-bottom-color:var(--acc);color:var(--ink)}
.filters select{border-radius:0;background:transparent}
.filters select.set{background:transparent;border-color:var(--ink);color:var(--ink)}
/* lists: ruled columns of copy, no boxes */
.jlist,.mlist{border:0;border-top:1px solid var(--ink);border-radius:0;background:transparent}
.jlist>.card,.mlist>.card{border:0;border-bottom:1px solid var(--line);padding:26px 0;background:transparent}
.jlist>.card:last-child,.mlist>.card:last-child{border-bottom:1px solid var(--line)}
.jcard:hover{background:transparent}.jcard:hover h3{color:var(--acc)}
.jcard h3,.mcard h3{font-size:23px!important}
.jcard .desc{font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--ink2)}
.reason{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink2)}
.mcard{grid-template-columns:auto 1fr auto;gap:14px 22px}
.mscore{min-width:96px}
.mact{padding-top:2px}
.mcard.top1{border-color:var(--line)}
.mcard.top1 .mhead h3::after{content:"Best fit";font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-left:12px;vertical-align:middle}
.bd{background:transparent;border-top:1px solid var(--line);border-radius:0;padding:12px 0 0}
.bd-pts{font-family:var(--serif);font-weight:500;font-size:16px}
.side .card{border:0;border-top:1px solid var(--ink);padding:16px 0 4px}
.side .card h3{font-size:19px}
/* tables: a printed ledger */
.tw{border:0;border-top:1px solid var(--ink);border-radius:0;background:transparent}
th{background:transparent;border-bottom:1px solid var(--ink);font-size:11px;letter-spacing:.12em;color:var(--ink2)}
td.best{background:var(--surface2)}
.best-tag{color:var(--acc);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
/* chat: correspondence, not bubbles */
.chat{border-radius:0;background:transparent;border:1px solid var(--line)}
.titem.on{background:var(--surface2);box-shadow:inset 1px 0 0 var(--acc)}
.titem:hover{background:var(--surface2)}
.msgs{background:var(--card)}
.msg,.msg.me,.msg.them{border-radius:0;font-size:15px}
.msg.me{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.msg.sys{font-family:var(--serif);font-style:italic;font-size:14px}
.dot{border-radius:0;background:var(--acc);width:7px;height:7px}
/* dialogs and popovers */
.sheet{background:rgba(29,27,24,.42)}
.sheet-body{border-radius:0;border:1px solid var(--ink);box-shadow:none;background:var(--paper)}
.sheet-h h2{font-size:30px}
.x{border-radius:0;background:transparent;border:1px solid var(--line2);color:var(--ink)}
.rolecard,.pitem{border-radius:0;background:transparent}
.rolecard b{font-family:var(--serif);font-size:22px;font-weight:500}
.rolecard:hover,.pitem:hover{border-color:var(--acc);background:transparent}
.npanel{border-radius:0;box-shadow:none;border:1px solid var(--ink);background:var(--paper)}
.npanel h3{font-size:18px}
.nitem.new{background:var(--surface2)}
#toast{border-radius:0;background:var(--ink);color:var(--paper);font-family:var(--serif);font-size:16px;font-style:italic}
.heart{border-radius:0;background:transparent;border-color:var(--line2)}
.heart.on{color:var(--acc);border-color:var(--acc);background:transparent}
.skillbox{border-radius:0;background:var(--card)}
.port div{border-radius:0;background:transparent;border:0;border-top:1px solid var(--ink);padding:12px 0 0}
.port b{font-family:var(--serif);font-size:18px;font-weight:500}
.qa{border-radius:0;background:transparent;border-left:1px solid var(--acc);padding:4px 0 4px 14px}
.ms-n{border-radius:0;background:transparent;border:1px solid var(--line2);font-family:var(--serif);font-size:15px}
.ms.approved .ms-n{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ms.submitted .ms-n{background:transparent;border-color:var(--acc);color:var(--acc)}
.ms.active .ms-n{box-shadow:none;border-color:var(--ink);color:var(--ink);background:transparent}
.offerbox{border:1px solid var(--ink)!important;background:transparent!important}
.empty h3{font-size:26px}
.empty p{font-family:var(--serif);font-style:italic;font-size:17px}
footer{background:var(--paper);border-top:1px solid var(--ink);font-size:12.5px}
:root[data-theme="dark"] .cta,:root[data-theme="dark"] #toast{border:0}
:root[data-theme="dark"] .spill i{color:var(--paper)}

/* ---- freelancer entries (talent pages): a ruled directory, not a card grid ---- */
.fgrid{display:block;border-top:1px solid var(--ink)}
.fcard{display:grid;grid-template-columns:minmax(210px,1fr) minmax(0,2fr) minmax(170px,.85fr);gap:30px;padding:26px 0;border-bottom:1px solid var(--line)}
.fc-who{display:flex;gap:14px;align-items:flex-start}
.fc-name{font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.15;text-decoration:none;color:var(--ink)}
.fc-name:hover{color:var(--acc)}
.fc-body p{font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--ink2);margin:0 0 12px}
.fc-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-left:1px solid var(--line);padding-left:20px}
.fc-side .meta{flex-direction:column;gap:2px}

/* ---- landing: an issue cover and its departments ---- */
.ed-dateline{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:12px 0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);flex-wrap:wrap}
.ed-cover{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;padding:48px 0 64px;border-bottom:1px solid var(--ink)}
.ed-cover-main{grid-column:1/span 8;padding-right:20px}
.ed-cover h1{font-size:clamp(46px,7.4vw,96px);line-height:.95;letter-spacing:-.035em;margin:18px 0 26px;font-weight:400}
.ed-cover h1 em{font-style:italic;color:var(--acc)}
.ed-lead{font-family:var(--serif);font-size:21px;line-height:1.45;color:var(--ink2);max-width:600px;margin-left:12%}
.ed-lead::first-letter{font-size:3.4em;float:left;line-height:.82;margin:6px 8px 0 0;color:var(--ink);font-weight:500}
.ed-ask{display:flex;align-items:flex-end;gap:14px;max-width:620px;margin:30px 0 0 12%}
.ed-ask input{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:10px 0;font-family:var(--serif);font-size:19px;font-style:italic}
.ed-ask input:focus{outline:0;border-bottom-color:var(--acc)}
.ed-try{margin:14px 0 0 12%;font-size:13.5px;color:var(--mute)}
.ed-try .link{font-weight:400}
.ed-cover-side{grid-column:10/span 3;border-left:1px solid var(--line);padding-left:24px;align-self:end}
.ed-side-h{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--mute);margin:6px 0 16px}
.ed-pick{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:1px solid var(--ink);padding-top:12px}
.ed-pick .score b{font-size:64px}
.ed-pick-name{font-family:var(--serif);font-size:23px;line-height:1.1;margin:10px 0 2px}
.ed-quote{font-family:var(--serif);font-size:17px;line-height:1.45;font-style:italic;color:var(--ink2);margin:14px 0 16px;padding-top:14px;border-top:1px solid var(--line)}
.ed-parts{font-size:12.5px}
.ed-parts div{display:grid;grid-template-columns:1fr 56px;gap:6px;padding:5px 0;border-top:1px solid var(--line)}
.ed-parts span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.ed-sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;padding:64px 0;border-bottom:1px solid var(--line)}
.ed-sec-h{grid-column:1/span 3}
.ed-sec-h h2{font-size:34px;margin:10px 0 12px}
.ed-sec-h p{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--mute)}
.ed-sec-b{grid-column:5/span 8}
.ed-sec.flip .ed-sec-h{grid-column:10/span 3;grid-row:1;border-left:1px solid var(--line);padding-left:24px}
.ed-sec.flip .ed-sec-b{grid-column:1/span 8;grid-row:1}
.ed-two{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.ed-two>div+div{border-left:1px solid var(--line);padding-left:40px}
.ed-two h3{font-size:22px;font-style:italic;margin:0 0 6px}
.ed-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.ed-steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:4px;padding:16px 0;border-top:1px solid var(--line)}
.ed-steps li::before{content:counter(s);font-family:var(--serif);font-size:34px;line-height:1;color:var(--acc)}
.ed-steps b{display:block;font-family:var(--serif);font-size:18px;font-weight:500;margin-bottom:2px}
.ed-steps span{font-size:14.5px;color:var(--mute)}
.ed-weights{border-top:1px solid var(--ink)}
.ed-w{display:grid;grid-template-columns:110px 1fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ed-w-n{font-family:var(--serif);font-size:56px;line-height:.9;letter-spacing:-.04em}
.ed-w:first-child .ed-w-n{color:var(--acc)}
.ed-w b{font-family:var(--serif);font-size:20px;font-weight:500}
.ed-w p{margin:2px 0 0;color:var(--mute);font-size:14.5px}
.ed-pull{font-family:var(--serif);font-size:25px;line-height:1.3;font-style:italic;margin:4px 0 22px;color:var(--ink)}
.ed-fine{list-style:none;padding:0;margin:0;font-size:14px;color:var(--mute)}
.ed-fine li{padding:9px 0;border-top:1px solid var(--line)}
.ed-fine b{color:var(--ink)}
.ed-index{columns:2;column-gap:48px;column-rule:1px solid var(--line);border-top:1px solid var(--ink);padding-top:6px}
.ed-index button{display:flex;align-items:baseline;width:100%;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;break-inside:avoid}
.ed-index button:hover .ed-ix-n{color:var(--acc)}
.ed-ix-n{font-family:var(--serif);font-size:20px}
.ed-ix-l{flex:1;border-bottom:1px dotted var(--line2);transform:translateY(-5px)}
.ed-ix-c{font-size:13px;color:var(--mute);white-space:nowrap}
.ed-people{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);column-gap:40px;border-top:1px solid var(--ink)}
.ed-feature{padding:26px 40px 0 0;border-right:1px solid var(--line)}
.ed-feature h3{font-size:40px;font-weight:400;margin:12px 0 4px}
.ed-feature .ed-role{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--mute);margin:0 0 18px}
.ed-feature blockquote{margin:0 0 18px;font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--ink2)}
.ed-brief{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:20px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ed-brief:hover .ed-brief-n{color:var(--acc)}
.ed-brief-n{font-family:var(--serif);font-size:21px;line-height:1.15}
.ed-brief p{margin:6px 0 0;font-size:14px;color:var(--mute)}
.ed-close{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:28px;padding:72px 0 80px;align-items:end}
.ed-close h2{grid-column:1/span 7;font-size:clamp(38px,5vw,64px);line-height:1;letter-spacing:-.03em;margin:0}
.ed-close h2 em{color:var(--acc)}
.ed-close div{grid-column:9/span 4;border-left:1px solid var(--line);padding-left:24px}
.ed-close p{font-family:var(--serif);font-size:17px;color:var(--ink2);margin:0 0 16px}

@media (max-width:900px){
 h1{font-size:36px}
 .ed-cover,.ed-sec,.ed-close{grid-template-columns:1fr;row-gap:28px}
 .ed-cover-main,.ed-cover-side,.ed-sec-h,.ed-sec-b,.ed-sec.flip .ed-sec-h,.ed-sec.flip .ed-sec-b,.ed-close h2,.ed-close div{grid-column:1/-1;grid-row:auto}
 .ed-cover-main{padding-right:0}
 .ed-cover-side,.ed-sec.flip .ed-sec-h,.ed-close div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:20px}
 .ed-lead,.ed-ask,.ed-try{margin-left:0}
 .ed-people{grid-template-columns:1fr}
 .ed-feature{border-right:0;padding-right:0;padding-bottom:24px;border-bottom:1px solid var(--line)}
 .fcard{grid-template-columns:1fr 1.6fr;gap:20px}
 .fc-side{grid-column:1/-1;border-left:0;padding-left:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px}
 .fc-side .meta{flex-direction:row;gap:4px 14px}
}
@media (max-width:640px){
 .hdr-in{height:auto;padding-top:10px;padding-bottom:0;gap:6px 12px}
 .nav{order:3;flex-basis:100%;align-self:auto;border-top:1px solid var(--line);margin:0;padding:2px 0}
 .nav a,.nav button{padding:10px 8px 9px;font-size:11px}
 .hdr-r{margin-left:auto}
 h1,.ph h1{font-size:32px}
 .logo{font-size:25px}
 .ed-cover{padding:32px 0 44px}
 .ed-lead{font-size:18.5px}
 .ed-ask{flex-direction:column;align-items:stretch}
 .ed-two{grid-template-columns:1fr}
 .ed-two>div+div{border-left:0;padding-left:0;margin-top:28px}
 .ed-index{columns:1}
 .ed-w{grid-template-columns:76px 1fr;gap:14px}.ed-w-n{font-size:42px}
 .ed-sec{padding:44px 0}
 .fcard{grid-template-columns:1fr;gap:14px}
 .mcard .mscore{align-items:flex-start}
}

/* ---- landing hero: full-screen video, wordmark bottom-left, search that opens on focus ---- */
body.on-landing #hdr{position:fixed;left:0;right:0;top:0;background:transparent;border-bottom-color:rgba(244,239,230,.16);transition:background .35s,border-color .35s}
body.on-landing:not(.scrolled) #hdr .nav a,body.on-landing:not(.scrolled) #hdr .nav button,body.on-landing:not(.scrolled) #hdr .icon-btn,body.on-landing:not(.scrolled) #hdr .logo{color:#f4efe6}
body.on-landing:not(.scrolled) #hdr .btn.plain{color:#f4efe6;border-color:rgba(244,239,230,.45)}
body.on-landing:not(.scrolled) #hdr .btn:not(.plain){background:#f4efe6;color:#1d1b18;border-color:#f4efe6}
body.on-landing:not(.scrolled) #hdr .nav a:hover,body.on-landing:not(.scrolled) #hdr .nav button:hover{color:#e07656}
body.on-landing.scrolled #hdr{background:var(--paper);border-bottom-color:var(--ink)}
/* menu links: a touch bigger and bolder everywhere */
.nav a,.nav button{font-size:13.5px;font-weight:700;letter-spacing:.09em}
.hx{position:relative;overflow:hidden;background:#151310;color:#f4efe6;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:110px 20px 120px}
.hx-video{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;animation:hx-zoom 24s ease-in-out infinite alternate}
@keyframes hx-zoom{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.hx-yt{position:absolute;inset:0;overflow:hidden;pointer-events:none;animation:hx-yt-in 1.6s .6s both}
.hx-yt iframe{position:absolute;top:50%;left:50%;width:max(100%,177.78vh);height:max(100%,56.25vw);transform:translate(-50%,-50%) scale(1.18);border:0;animation:hx-zoom-yt 24s ease-in-out infinite alternate}
@keyframes hx-zoom-yt{from{transform:translate(-50%,-50%) scale(1.18)}to{transform:translate(-50%,-50%) scale(1.3)}}
@keyframes hx-yt-in{from{opacity:0}}
.hx-shade{position:absolute;inset:0;z-index:1;background:rgba(14,12,10,.58)}
.hx.no-video .hx-video{display:none}
.hx-in{position:relative;width:100%;max-width:820px;text-align:center;z-index:2}
.hx-h{font-family:var(--serif);font-weight:400;color:#f4efe6;font-size:clamp(40px,5.6vw,72px);line-height:1.02;letter-spacing:-.03em;margin:0 0 40px;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.hx.no-video .hx-h{text-shadow:none}
.hx-h em{color:#ef8a6a}
.hx-panel{position:relative;text-align:left;border-radius:22px;padding:14px;border:1px solid transparent;transition:background .35s,border-color .35s,backdrop-filter .35s}
.hx-panel.open{background:rgba(26,23,19,.55);border-color:rgba(244,239,230,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hx-search{display:flex;align-items:center;background:#f4efe6;border-radius:999px;padding:6px 6px 6px 26px;box-shadow:0 0 0 0 rgba(239,138,106,0);transition:box-shadow .3s}
.hx-panel.open .hx-search{box-shadow:0 0 0 4px rgba(239,138,106,.35)}
.hx-search input{border:0;background:transparent;color:#1d1b18;font-size:18px;padding:12px 0;outline:0}
.hx-search input:focus{outline:0}
.hx-search input::placeholder{color:#857d70}
.hx-search button{flex:none;width:50px;height:50px;border-radius:50%;border:0;background:#1d1b18;color:#f4efe6;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s}
.hx-search button:hover{background:#a8361c;transform:scale(1.06)}
.hx-drop{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.3,.7,.2,1),opacity .3s}
.hx-panel.open .hx-drop{grid-template-rows:1fr;opacity:1}
.hx-drop-in{overflow:hidden;min-height:0}
.hx-panel.hx-typing .hx-tabs,.hx-panel.hx-typing .hx-list[data-t=quick],.hx-panel.hx-typing .hx-list[data-t=trend]{display:none}
.hx-panel:not(.hx-typing) .hx-match{display:none}
.hx-match{padding-top:8px}
.hx-tabs{position:relative;display:flex;justify-content:center;gap:8px;margin:14px 0 0;border-bottom:1px solid rgba(244,239,230,.18)}
.hx-tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;font:inherit;font-size:16px;font-weight:600;color:rgba(244,239,230,.62);padding:12px 22px;cursor:pointer;transition:color .2s}
.hx-tabs button svg{width:16px;height:16px}
.hx-tabs button.on,.hx-tabs button:hover{color:#f4efe6}
.hx-ink{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:#f4efe6;transition:transform .35s cubic-bezier(.3,.7,.2,1),width .35s cubic-bezier(.3,.7,.2,1)}
.hx-list button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;border-bottom:1px solid rgba(244,239,230,.12);color:#f4efe6;font:inherit;font-size:17px;padding:17px 12px;cursor:pointer;text-align:left;border-radius:10px;transition:background .2s}
.hx-list button:last-child{border-bottom:0}
.hx-list button:hover,.hx-list button.act{background:rgba(244,239,230,.09)}
.hx-list button b{color:#ef8a6a;font-weight:600}
.hx-list button svg{flex:none;transition:transform .25s}
.hx-list button:hover svg,.hx-list button.act svg{transform:translate(3px,-3px)}
.hx-list small{color:rgba(244,239,230,.55);font-size:13px;margin-left:8px}
.hx-panel.open .hx-list:not([hidden]) button{animation:hx-row .4s both}
.hx-list button:nth-child(2){animation-delay:.05s}.hx-list button:nth-child(3){animation-delay:.1s}.hx-list button:nth-child(4){animation-delay:.15s}
@keyframes hx-row{from{opacity:0;transform:translateY(6px)}}
.hx-sub{margin:22px 0 0;font-size:15px}
.hx-sub .link{color:rgba(244,239,230,.8);font-weight:500}
.hx-sub .link:hover{color:#f4efe6}
.hx-h,.hx-panel,.hx-sub{animation:hx-up .9s cubic-bezier(.2,.7,.2,1) both}
.hx-panel{animation-delay:.15s}.hx-sub{animation-delay:.3s}

/* skill detection (PRD 6.1) */
const KW=[[/\bmobile|\bios\b|\bandroid|\biphone/,['Flutter']],[/chat ?bot|\bai\b|\bgpt|\bllm|language model|\bassistant/,['LLM']],[/\bwebsite|\bweb ?app|\blanding page/,['React']],[/\bstore\b|\bshopify|e-?commerce/,['Shopify']],[/\bpayment|\bcheckout|\bsubscription/,['Stripe']],[/\bbackend|\bapi\b|\baccounts?\b|\blogin/,['Node.js','Firebase']],[/\blogo|\bbrand(ing| kit)/,['Branding']],[/\bdesign|\bui\b|\bux\b|\binterface/,['UI Design']],[/\bblog|\bseo\b|\bcopy\b/,['SEO','Copywriting']],[/\bdatabase|\bsql\b/,['PostgreSQL']],[/\brecommend|\bpredict|machine learning|\bml\b/,['Machine Learning']],[/\bdashboard|\banalytics/,['React','Data Analysis']],[/\bpython\b/,['Python']],[/\brag\b|help (center|articles)|knowledge base/,['NLP']]];
const allSkills=()=>CATALOG;
function detect(text){
 const t=String(text).toLowerCase(),out=[];
 KW.forEach(([re,sk])=>{if(re.test(t))out.push(...sk)});
 allSkills().forEach(s=>{if(NO_DETECT.has(s))return;const re=new RegExp('(^|[^a-z0-9])'+s.toLowerCase().replace(/[.+#*?()[\]\\/]/g,'\\$&')+'($|[^a-z0-9])');if(re.test(t))out.push(s)});
 const seen=new Set(),res=[];out.forEach(s=>{const k=nk(s);if(!seen.has(k)){seen.add(k);res.push(s)}});return res.slice(0,6);
}

function openPropose(pid){
 const p=pj(pid),f=fl(D.ui.fid),m=score(f,p),ex=propOf(pid,f.id),edit=!!ex&&['submitted','shortlisted'].includes(ex.status);
 if(ex&&!edit)return toast('You already applied to this project');
 if(edit&&offerFor(ex.id))return toast('You have an offer on this proposal. Reply to it instead.');
 const hourly=p.type==='hourly',free=invited(pid,f.id),cost=free?0:connCost(p),short=!edit&&f.connects<cost;
 const bid=edit?ex.bid:hourly?Math.min(f.rate,p.rateMax):(Math.round(Math.min(p.budget,f.rate*p.hours)/50)*50||p.budget);
 const days=edit?ex.days:Math.max(5,Math.ceil(p.hours/Math.max(10,f.hpw||30)*7));
 openSheet(sheetH(edit?'Edit your proposal':'Submit a proposal',`${esc(p.title)} · ${esc(cname(p))} · ${hourly?`$${p.rateMin}–$${p.rateMax}/hr`:'budget '+money(p.budget)}`)+`
 <div class="hint row" style="gap:10px;flex-wrap:nowrap">${spill(m.total)}<span>${reasonHtml(m,true)}</span></div>
 <label><span class="row between">Cover letter <button class="link sm" type="button" onclick="draftCover('${pid}')">Draft from my profile</button></span><textarea id="pp_cover" rows="7" autofocus placeholder="Why are you a good fit? Mention relevant work.">${edit?esc(ex.cover):''}</textarea></label>
 ${(p.questions||[]).length?`<div class="lbl">The client's questions</div>${p.questions.map((q,i)=>`<label style="font-weight:500">${esc(q)}<textarea id="pp_a${i}" rows="2">${edit?esc(ex.answers?.[i]||''):''}</textarea></label>`).join('')}`:''}
 <div class="grid2"><label>${hourly?'Your hourly rate (USD)':'Bid (USD)'}<input id="pp_bid" type="number" min="1" value="${bid}" oninput="bidHint('${pid}')"></label><label>Delivery time (days)<input id="pp_days" type="number" min="1" value="${days}"></label></div>
 <div id="pp_hint"></div>
 <label>Links <span class="mute sm" style="font-weight:400">(optional) portfolio, GitHub or shared files, one per line</span><textarea id="pp_links" rows="2" placeholder="e.g. github.com/yourname/project">${edit?esc((ex.links||[]).join('\n')):''}</textarea></label>
 ${edit?'':`<div class="hint">${free?'You were invited, so this proposal is <b>free</b>.':`This proposal costs <b>${cost} Connects</b>. You have <b>${f.connects}</b>.`}${short?' <b style="color:var(--red)">Not enough Connects to apply.</b>':''} Connects limit how many proposals you send, which keeps them focused.</div>`}
 <div class="row end"><button class="btn plain" onclick="closeSheet()">Cancel</button><button class="btn" onclick="submitProposal('${pid}')" ${short?'disabled':''}>${edit?'Save changes':'Submit proposal'}</button></div>`);

function bidHint(pid){const p=pj(pid),b=+$('#pp_bid')?.value,el=$('#pp_hint');if(!el)return;if(!(b>0)){el.innerHTML='';return}const ref=bidRef(p),d=Math.round((b/ref-1)*100),what=p.type==='hourly'?`max rate of $${ref}/hr`:`${money(ref)} budget`;el.innerHTML=`<div class="hint">Your ${p.type==='hourly'?'rate':'bid'} is <b>${d===0?'equal to':Math.abs(d)+'% '+(d>0?'over':'under')}</b> the client's ${what}.${d>15?' Bids far above budget are less likely to be accepted.':''}</div>`}
function draftCover(pid){
 if(!(API.on&&API.ai))return templateDraft(pid);
 const el=$('#pp_cover'),f=fl(D.ui.fid);if(!el)return;
 el.value='Writing your draft with Claude…';el.disabled=true;
 api('POST','/ai/draft-proposal',{project_id:pid,freelancer_id:f._id,bid:+($('#pp_bid')?.value)||null,days:+($('#pp_days')?.value)||null})
  .then(r=>{el.disabled=false;if(r&&r.cover_letter){el.value=r.cover_letter;toast('Draft written by Claude from your profile. Edit it before sending.')}else templateDraft(pid)})
  .catch(()=>{el.disabled=false;templateDraft(pid)});

function templateDraft(pid){
 const p=pj(pid),f=fl(D.ui.fid),m=score(f,p);
 $('#pp_cover').value=`Hi! I'm ${f.name.split(' ')[0]}, a ${f.title} with ${f.years} year${f.years===1?'':'s'} of experience.\n\nYour project needs ${andList(p.skills)}. I work with ${m.matched.length?andList(m.matched):'related tools'} every day${m.port?`, and recently built “${m.port.t}”: ${m.port.d.replace(/\.$/,'')}`:''}.${m.missing.length?`\n\nFor ${andList(m.missing)}, I'd ramp up quickly or bring in a trusted collaborator.`:''}\n\nI'd start with a short kickoff call to agree on scope, then share progress every few days. Happy to answer any questions!`;

}
function submitProposal(pid){
 const f=fl(D.ui.fid),p=pj(pid),ex=propOf(pid,f.id),edit=!!ex&&['submitted','shortlisted'].includes(ex.status);
 const cover=$('#pp_cover').value.trim(),bid=+$('#pp_bid').value,days=+$('#pp_days').value;
 const answers=(p.questions||[]).map((q,i)=>($('#pp_a'+i)?.value||'').trim());
 const links=($('#pp_links').value||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5);
 if(cover.length<20)return toast('Write a short cover letter (or use the draft)'),$('#pp_cover').focus();
 const miss=answers.findIndex(a=>!a);if(miss>=0)return toast("Answer the client's questions"),$('#pp_a'+miss).focus();
 if(!(bid>0))return toast('Enter a bid'),$('#pp_bid').focus();if(!(days>0))return toast('Enter delivery time'),$('#pp_days').focus();
 if(ex&&!edit)return toast('You already applied to this project');
 if(API.on){const body={cover_letter:cover,bid,days,answers,links};return act(()=>edit?api('PATCH',`/proposals/${ex.id}`,{freelancer_id:f._id,...body}):api('POST',`/projects/${pid}/proposals`,{freelancer_id:f._id,...body}),r=>{closeSheet();toast(edit?'Proposal updated':`Proposal sent to ${cname(p)}${r.connects_spent?` · ${r.connects_spent} Connects used`:''}`);soft()})}
 if(edit){
  Object.assign(ex,{cover,bid,days,answers,links,edited:NOW()});
  sysMsg(pid,f.id,`${f.name} updated their proposal: ${bidTxt(ex,p)} · ${days} days`);
  notifyClient(p,`${f.name} updated their proposal on “${p.title}”`,'#/proposals/'+pid);
  save();closeSheet();toast('Proposal updated');soft();return;
 }
 const cost=invited(pid,f.id)?0:connCost(p);
 if(f.connects<cost)return toast('Not enough Connects');
 f.connects-=cost;
 const q={id:'q'+(++D.seq),pid,fid:f.id,cover,bid,days,status:'submitted',ts:NOW(),answers,links,connects:cost};
 D.props.push(q);
 ensureThread(pid,f.id).msgs.push({f:'s',t:`${f.name} submitted a proposal: ${bidTxt(q,p)} · ${days} days`,ts:NOW()});
 notifyClient(p,`New proposal from ${f.name} on “${p.title}”`,'#/proposals/'+pid);
 logEv('proposal',pid,f.id);save();closeSheet();toast(`Proposal sent to ${cname(p)}${cost?` · ${cost} Connects used`:''}`);soft();
}
function withdrawProposal(qid,ok){
 const q=D.props.find(x=>x.id===qid),p=pj(q.pid),f=fl(q.fid);
 if(offerFor(qid))return toast('You have an offer on this proposal. Decline the offer instead.');
 if(!ok){openSheet(sheetH('Withdraw your proposal?',esc(p.title))+`<p class="mute sm">The client will see it as withdrawn and you can't re-apply. Connects you spent are not refunded.</p><div class="row end"><button class="btn plain" onclick="closeSheet()">Cancel</button><button class="btn danger" onclick="closeSheet();withdrawProposal('${qid}',true)">Withdraw</button></div>`);return}
 if(API.on)return act(()=>api('POST',`/proposals/${qid}/withdraw?freelancer_id=${encodeURIComponent(f._id)}`),()=>{toast('Proposal withdrawn');soft()});
 q.status='withdrawn';sysMsg(q.pid,q.fid,`${f.name} withdrew their proposal`);
 notifyClient(p,`${f.name} withdrew their proposal on “${p.title}”`,'#/proposals/'+p.id);
 save();toast('Proposal withdrawn');soft();
}

/* ============ OFFERS, CONTRACTS, MILESTONES, REVIEWS ============ */
const bidRef=p=>p.type==='hourly'?p.rateMax:p.budget;
const bidTxt=(q,p)=>p.type==='hourly'?`$${q.bid}/hr`:money(q.bid);
const safeUrl=u=>{u=String(u).trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?esc(x.href):'#'}catch(e){return '#'}};
const fts=ts=>new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const notifyClient=(p,t,l)=>{if(p.owner==='me')notify('c',t,l)};
const offerFor=qid=>D.offers.find(o=>o.qid===qid&&o.status==='pending');
const pendingOffer=pid=>D.offers.find(o=>o.pid===pid&&o.status==='pending');
const contractOf=pid=>D.contracts.find(c=>c.pid===pid);
const revOf=(cid,dir)=>D.reviews.find(r=>r.cid===cid&&r.dir===dir);
const msTotal=x=>x.ms.reduce((a,m)=>a+(+m.amt||0),0);

 c.status='ended';c.endTs=NOW();p.status='ended';

 <div class="secttl"><h2>My proposals</h2></div>
 ${mine.length?`<div class="tw"><table style="min-width:760px"><thead><tr><th>Project</th><th>Match</th><th>Bid</th><th>Delivery</th><th>Status</th><th></th></tr></thead><tbody>${mine.map(q=>{const p=pj(q.pid);return p?`<tr><td><a href="#/project/${p.id}"><b>${esc(p.title)}</b></a><div class="xs mute">${esc(p.client.replace(' (you)',''))} · ${ago(q.ts)}</div></td><td>${spill(score(f,p).total)}</td><td>${bidTxt(q,p)}</td><td>${q.days} days</td><td><span class="pill st-${offerFor(q.id)?'offer':q.status}">${offerFor(q.id)?'offer received':q.status}</span></td><td><div class="row" style="gap:6px;flex-wrap:nowrap">${offerFor(q.id)?`<button class="btn sm" onclick="go('#/offer/${offerFor(q.id).id}')">View offer</button>`:''}${contractOf(p.id)&&contractOf(p.id).fid===f.id?`<button class="btn sm" onclick="go('#/contract/${contractOf(p.id).id}')">Contract</button>`:''}${!offerFor(q.id)&&['submitted','shortlisted'].includes(q.status)&&p.status==='open'?`<button class="btn ghost sm" onclick="go('#/project/${p.id}');setTimeout(()=>openPropose('${p.id}'),50)">Edit</button><button class="btn danger sm" onclick="withdrawProposal('${q.id}')">Withdraw</button>`:''}<button class="btn plain sm" onclick="go('#/chat/${tkey(p.id,f.id)}')">Chat</button></div></td></tr>`:''}).join('')}</tbody></table></div>`:'<div class="card empty" style="padding:24px">No proposals yet. Pick a match above and apply in a minute.</div>'}
 </div><aside class="side"><div class="card"><div class="row">${av(f,48)}<div><b>${esc(f.name)}</b><div class="mute sm">${esc(f.title)}</div></div></div>
 <div class="meta" style="margin:10px 0"><span><b>$${f.rate}</b>/hr</span><span>${stars(f)}</span><span>${f.years} yrs</span></div>

 <div class="row" style="margin-top:12px"><button class="btn ghost sm" onclick="go('#/me')">Edit profile</button><button class="btn plain sm" onclick="go('#/profile/${f.id}')">Public view</button></div></div>
 <div class="card"><h3>Improve your matches</h3><ul class="mute sm" style="padding-left:18px;margin:6px 0 0">${tips(f,ranked).map(t=>`<li style="margin-bottom:6px">${t}</li>`).join('')}</ul></div></aside></div></div>`;
}
function tips(f,ranked){
 const miss={};ranked.slice(0,6).forEach(m=>m.missing.forEach(s=>miss[s]=(miss[s]||0)+1));
 const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
 const t=[];
 if(top.length)t.push(`Your best-fit projects often ask for <b style="color:var(--ink)">${top.map(esc).join(' and ')}</b>. Add them if you have them (skill coverage is 45% of the score).`);
 if(f.port.length<2)t.push('Add portfolio items. Their text feeds the similarity signal (20%).');
 const over=ranked.slice(0,5).filter(m=>m.f.rate>m.target).length;
 if(over)t.push(`Your rate is above budget on ${over} of your top 5 matches. Budget fit is 20% of the score.`);
 if(!t.length)t.push('Your profile is in great shape. Keep your availability up to date.');
 return t;
}

// The backend uses text ids ("f01", "f_3a9c..."); the screens use numbers. Map between them, stably.
function fnum(id){const m=/^f(\d+)$/.exec(id);if(m)return +m[1];if(!FNUM[id]){FNUM[id]=1000+Object.keys(FNUM).length+1;try{localStorage.setItem(FNUM_KEY,JSON.stringify(FNUM))}catch(e){}}return FNUM[id]}

async function api(method,path,body){

 try{r=await fetch(API.base+path,{method,headers,body:body?JSON.stringify(body):undefined})}
 catch(e){throw new Error("Can't reach the Gigwise server. Is the backend running?")}
 if(r.status===401&&tok){authExpired();throw new Error('Your login has expired. Please log in again.')}
 let data=null;try{data=await r.json()}catch(e){}
 if(!r.ok){const d=data&&data.detail;throw new Error(typeof d==='string'?d:Array.isArray(d)&&d[0]?.msg?d[0].msg.replace(/^Value error, /,''):`Request failed (${r.status})`)}

}

 const R=s.reviews.map(r=>{const c=C.find(x=>x.id===r.contract_id)||{};return{cid:r.contract_id,pid:c.pid,fid:c.fid,dir:r.direction==='client_to_freelancer'?'c2f':'f2c',r:r.rating,t:r.body,ts:tms(r.created_at)}});
 const TH={};s.threads.forEach(t=>{const n=fnum(t.freelancer_id),k=tkey(t.project_id,n);TH[k]={pid:t.project_id,fid:n,_id:t.id,invited:t.invited,
  msgs:s.messages.filter(m=>m.thread_id===t.id).map(m=>({f:{client:'c',freelancer:'f',system:'s'}[m.sender],t:m.body,ts:tms(m.created_at)})),
  read:{c:tms(t.client_read_at)||0,f:tms(t.freelancer_read_at)||0},auto:API.auto[k]||(API.auto[k]={c:false,f:false})}});
 const N=s.notifications.map(n=>({id:'n'+n.id,_id:n.id,to:n.recipient_type==='client'?(n.recipient_id===me?'c':'x'):fnum(n.recipient_id),t:n.body,link:n.link,ts:tms(n.created_at),read:n.read}));
 const SV={talent:s.saved_freelancers.filter(x=>x.client_id===me).map(x=>fnum(x.freelancer_id)),jobs:{}};
 s.saved_jobs.forEach(x=>{(SV.jobs[fnum(x.freelancer_id)]=SV.jobs[fnum(x.freelancer_id)]||[]).push(x.project_id)});
 API.me=s.me;API.meF=s.me_freelancer||null;API.world=s.world;
 const ui=(D&&D.ui&&D.world===s.world)?D.ui:loadUi();
 if(s.world==='real')ui.fid=API.meF?fnum(API.meF.id):null;  // signed in: you are only ever your own freelancer
 D={v:2,live:true,world:s.world,seq:(D&&D.seq)||100,fl:F,pr:P,props:Q,offers:O,contracts:C,reviews:R,th:TH,notes:N,saved:SV,log:[],ui};
};
function loadUi(){try{const u=JSON.parse(localStorage.getItem(uiKey())||'null');if(u)return u}catch(e){}return{role:null,fid:null}}
// Run one action against the API, then reload from the database so the screen shows what was saved.
async function act(call,done){
 if(API.busy)return;API.busy++;document.body.style.cursor='progress';
 try{const r=await call();await API.sync();if(done)done(r);else soft()}
 catch(e){toast(e.message||'Something went wrong');try{await API.sync()}catch(_){};soft()}
 finally{API.busy--;document.body.style.cursor=''}
}
const bodyFor=d=>({name:d.name,title:d.title,skills:d.skills,rate:d.rate,years:Math.max(0,d.years||0),hours_per_week:d.hpw||0,available:d.available,location:d.loc||'',bio:d.bio||'',
 portfolio:(d.port||[]).map(x=>({title:x.t,description:x.d||''})),employment:(d.emp||[]).map(x=>({role:String(x.role||''),company:String(x.co||''),from:String(x.from||''),to:String(x.to||'')})),
 education:(d.edu||[]).map(x=>({school:String(x.school||''),degree:String(x.deg||''),year:String(x.yr||'')})),certifications:(d.cert||[]).map(x=>({name:String(x.name||''),issuer:String(x.by||''),year:String(x.yr||'')})),
 languages:(d.lang||[]).map(x=>({language:String(x.l||''),level:String(x.lv||'')}))});
function useOffline(){try{localStorage.setItem(MODE_KEY,'offline')}catch(e){}location.reload()}
function useLive(){try{localStorage.removeItem(MODE_KEY)}catch(e){}location.reload()}
// Pick up changes made elsewhere (another browser, a teammate) every 20 seconds while the tab is open.
setInterval(()=>{if(!API.on||API.busy||document.hidden||$('#sheet').classList.contains('open'))return;const a=document.activeElement;if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))return;API.sync().then(()=>soft()).catch(()=>{})},20000);
async function boot(){
 window.addEventListener('hashchange',render);
 let forcedOffline=false;try{forcedOffline=localStorage.getItem(MODE_KEY)==='offline'}catch(e){}
 $('#app').innerHTML='<div class="wrap page"><div class="card empty"><h3>Loading Gigwise…</h3></div></div>';
 try{
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),2500);
  const h=await fetch(API.base+'/health',{signal:ctl.signal}).then(r=>r.json());clearTimeout(tm);
  API.reachable=!!(h&&h.ok);API.resetOk=h&&h.demo_reset!==false;API.ai=!!(h&&h.ai);
  if(API.reachable&&!forcedOffline){await initAuth();D=null;await API.sync();API.on=true}
 }catch(e){}
 if(!API.on)load();
 render();
}

/* ============ boot ============ */
boot();
</script>
