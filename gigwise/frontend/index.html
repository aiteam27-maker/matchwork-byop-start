<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gigwise</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#16211c;--mute:#5f6b66;--line:#e2e7e3;--soft:#f0f3f1;--brand:#0e7c66;--brand-d:#0a5e4e;--brand-l:#e2f3ee;--blue:#2f6fd1;--blue-l:#e6efff;--amber:#a86512;--amber-l:#fdf1dc;--red:#b42318;--red-l:#fde8e6;--gray:#8a918d;--r:14px;--sh:0 1px 2px rgba(16,24,20,.05),0 6px 20px rgba(16,24,20,.06)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:21px}h3{font-size:16px}
p{margin:0 0 .8em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}
.mute{color:var(--mute)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.between{justify-content:space-between}
.grow{flex:1}
.btn{appearance:none;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,transform .05s}
.btn:hover{background:var(--brand-d)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--brand)}.btn.ghost:hover{background:var(--brand-l)}
.btn.plain{background:transparent;border-color:var(--line);color:var(--ink)}.btn.plain:hover{background:var(--soft)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:#fff;border-color:#f0c4bf;color:var(--red)}.btn.danger:hover{background:var(--red-l)}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;font:inherit;color:var(--brand);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:12.5px;color:#33403a;white-space:nowrap}
.chip.ok{background:var(--brand-l);color:var(--brand-d)}
.chip.miss{background:#fff;border:1px dashed #d7b4b0;color:var(--red)}
.chip.tag{background:var(--blue-l);color:var(--blue)}
.chip.warn{background:var(--amber-l);color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.st-submitted{background:var(--soft);color:#3c4843}.st-shortlisted{background:var(--blue-l);color:var(--blue)}.st-accepted{background:var(--brand-l);color:var(--brand-d)}.st-declined{background:var(--red-l);color:var(--red)}
.t1{--c:#0e7c66}.t2{--c:#2f6fd1}.t3{--c:#b7791f}.t4{--c:#8a918d}
.tierlbl{font-size:12px;font-weight:700;color:var(--c)}
.ring{--s:56px;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),#e6ebe8 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.ring span{position:relative;font-weight:800;font-size:17px;color:var(--ink)}
.ring.sm{--s:42px}.ring.sm span{font-size:14px}.ring.sm::before{inset:4px}
.spill{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}
.spill i{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
input,textarea,select{font:inherit;color:inherit;border:1px solid #cfd7d2;border-radius:10px;padding:9px 12px;background:#fff;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid #9ad3c4;border-color:var(--brand)}
textarea{resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
label input,label textarea,label select{margin-top:6px;font-weight:400}
.lbl{font-weight:600;font-size:14px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.hint{font-size:13px;color:var(--mute);background:var(--soft);border-radius:10px;padding:9px 12px;margin-bottom:14px}
.hint b{color:var(--ink)}
/* header */
#hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--ink);letter-spacing:-.02em}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a,.nav button{padding:7px 12px;border-radius:8px;color:#34413b;font-weight:500;white-space:nowrap;background:none;border:0;font:inherit;cursor:pointer}
.nav a:hover,.nav button:hover{background:var(--soft)}
.nav a.on{color:var(--brand-d);background:var(--brand-l);font-weight:600}
.hdr-r{display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);background:#fff}
.icon-btn:hover{background:var(--soft)}
.badge{position:absolute;top:-4px;right:-4px;background:#e0412f;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:4px 11px;font-size:13px}
.who{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px 3px 3px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
main{min-height:calc(100vh - 140px);padding-bottom:40px}
.page{padding-top:28px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph p{margin:0}
/* landing */
.hero{padding:44px 0 36px}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:44px;letter-spacing:-.03em;margin:18px 0 14px}
.lead{font-size:18px;color:#3e4b45;max-width:540px}
.hero-q{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--sh);max-width:560px;margin-top:22px}
.hero-q input{border:0;border-radius:999px}
.hero-q input:focus{outline:none}
.try{margin-top:12px;font-size:13px;color:var(--mute)}
.try .link{font-weight:500}
.sample{position:relative}
.sample .card{padding:18px}
.sample .back{position:absolute;inset:18px -10px -14px 18px;background:var(--brand-l);border-radius:var(--r);z-index:-1}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:10px 0 50px}
.strip div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.strip b{display:block;font-size:24px;letter-spacing:-.02em}
.sec{margin:56px 0}
.sec-h{text-align:center;max-width:640px;margin:0 auto 26px}
.sec-h p{color:var(--mute);font-size:16px}
.how{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.weights{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.w-row{display:grid;grid-template-columns:170px 1fr 44px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.w-row:first-child{border-top:0}
.w-bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.w-bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.guard li{margin-bottom:8px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;font:inherit;transition:border-color .15s,box-shadow .15s}
.cat:hover{border-color:var(--brand);box-shadow:var(--sh)}
.cat b{display:block;font-size:16px}
.cta{background:var(--ink);color:#fff;border-radius:20px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h2{color:#fff;font-size:26px}
.cta p{color:#c4cec9;margin:0}
/* cards */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.fcard{display:flex;flex-direction:column;gap:10px}
.fcard .top{display:flex;gap:12px;align-items:center}
.fcard .bio{font-size:13.5px;color:#3e4b45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
.meta b{color:var(--ink)}
.star{color:#d08a00}
.avail{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--brand-d);font-weight:600}
.avail::before{content:"";width:7px;height:7px;border-radius:50%;background:#1aa37f}
.avail.no{color:var(--gray)}.avail.no::before{background:#c2c8c4}
/* matches */
.mlayout{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:14px}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px 16px;align-items:start;position:relative}
.mcard .rank{position:absolute;top:-9px;left:16px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px}
.mcard.top1{border-color:#9fd3c3;box-shadow:0 0 0 3px var(--brand-l),var(--sh)}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.mhead h3{margin:0}
.reason{margin:8px 0 10px;font-size:14.5px;color:#26332d}
.mscore{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px}
.mact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.bd{grid-column:1/-1;background:var(--soft);border-radius:12px;padding:12px 14px}
.bd-row{display:grid;grid-template-columns:1fr 160px 70px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid #e3e8e5}
.bd-row:first-child{border-top:0}
.bar{height:8px;background:#dfe5e1;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bd-pts{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bd-tot{text-align:right;padding-top:8px;border-top:1px solid #d5ddd8;margin-top:4px}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
.banner{display:flex;gap:12px;align-items:center;background:var(--brand-l);border:1px solid #bfe3d8;color:#0c4f42;border-radius:12px;padding:11px 14px;margin-bottom:16px;flex-wrap:wrap}
.banner.amber{background:var(--amber-l);border-color:#f1d6a6;color:#6b4208}
.banner.blue{background:var(--blue-l);border-color:#c9dafb;color:#1d4a91}
.psum{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
/* jobs */
.jcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s}
.jcard:hover{border-color:#a9cfc4}
.jcard .desc{font-size:14px;color:#3e4b45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.jlist{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input{max-width:340px}
.toolbar select{width:auto}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:#fafbfa;font-weight:600}
tr:last-child td{border-bottom:0}
td.best{background:#f1faf6}
.best-tag{display:block;font-size:11px;font-weight:700;color:var(--brand)}
tr.declined td{opacity:.55}
.cover{font-size:13px;color:#3e4b45;width:260px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cmp td:first-child{min-width:190px}.cmp td{white-space:normal}.cmp .nw{white-space:nowrap}
/* chat */
.chat{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 160px);min-height:460px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tlist{border-right:1px solid var(--line);overflow-y:auto}
.titem{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;color:inherit}
.titem:hover{background:var(--soft)}.titem.on{background:var(--brand-l)}
.titem .tx{min-width:0;flex:1}
.titem .last{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:#e0412f;flex:none;margin-top:6px}
.conv{display:flex;flex-direction:column;min-width:0}
.conv-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fafbfa}
.msg{max-width:72%;padding:9px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:14.5px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand);border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;border-bottom-left-radius:5px}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.msg.sys{align-self:center;background:none;border:0;color:var(--mute);font-size:12.5px;text-align:center;max-width:90%}
.typing{align-self:flex-start;color:var(--mute);font-size:13px;font-style:italic}
.chat-back{display:none;font-size:20px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{min-height:42px;max-height:120px}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty h3{color:var(--ink)}
/* profile */
.prof{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.port{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.port div{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafbfa}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.skillbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid #cfd7d2;border-radius:10px;padding:6px 8px;background:#fff;cursor:text;margin-bottom:8px}
.skillbox input{border:0;padding:4px;flex:1;min-width:160px;width:auto}
.skillbox input:focus{outline:none}
.skillbox .chip button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:inherit;font-size:14px;line-height:1}
.detected{font-size:13px;margin-bottom:14px;min-height:4px}
.dash{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.dash>*,.prof>*,.mlayout>*{min-width:0}
.secttl{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.secttl:first-child{margin-top:0}
.secttl h2{margin:0}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(14,22,18,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet.open{display:flex}
.sheet-body{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.x{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.rolecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolecard{border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#fff;text-align:left;font:inherit}
.rolecard:hover{border-color:var(--brand);background:#fbfefd}
.rolecard b{display:block;font-size:16px;margin:8px 0 4px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;background:#fff;font:inherit;text-align:left;width:100%}
.pitem:hover{border-color:var(--brand)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.heart{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;color:#9aa39e;display:grid;place-items:center;flex:none}
.heart:hover{border-color:#f3c3bc}.heart.on{color:#e0412f;border-color:#f3c3bc;background:#fff5f3}
.badges{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:middle}
.bdg{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f1eaff;color:#6b3fc4;white-space:nowrap}
.bdg.jss{background:var(--soft);color:#33403a}.bdg.rise{background:#e5f4ff;color:#1569a8}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters select{width:auto;padding:7px 10px;font-size:13.5px;border-radius:999px;background:#fff}
.filters select.set{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--mute);padding:9px 14px;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.bellwrap{position:relative}
.npanel{position:absolute;right:-60px;top:46px;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.16);z-index:30;max-height:440px;overflow-y:auto}
.npanel h3{padding:12px 14px 8px;margin:0;border-bottom:1px solid var(--line)}
.nitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;padding:11px 14px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.nitem:hover{background:var(--soft)}.nitem.new{background:#f2fbf8}.nitem.new::before{content:"● ";color:var(--brand)}
.ms{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.ms:first-child{border-top:0}
.ms-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--soft);color:var(--mute)}
.ms.approved .ms-n{background:var(--brand);color:#fff}.ms.submitted .ms-n{background:var(--blue);color:#fff}.ms.active .ms-n{background:var(--brand-l);color:var(--brand-d);box-shadow:0 0 0 2px var(--brand)}
.starpick{display:flex;gap:2px}

const ALIAS={node:'node.js',nodejs:'node.js','react.js':'react',reactjs:'react',ui:'ui design','ui/ux':'ui design',ux:'ux research',ml:'machine learning',js:'javascript',ts:'typescript',postgres:'postgresql',gpt:'llm','next':'next.js'};
const nk=s=>{s=String(s).toLowerCase().trim();return ALIAS[s]||s};
const STOP=new Set('the a an and or to of for in on with is are we i our us you your need needs want wants build building builds looking app apps that this it as be by from will can who which into plus also simple clean new one using use like get some more all any has have their them they its per via'.split(' '));
const tok=s=>(String(s).toLowerCase().match(/[a-z0-9+#.]{3,}/g)||[]).map(w=>w.replace(/\.+$/,'')).map(w=>w.length>4&&/[^s]s$/.test(w)?w.slice(0,-1):w).filter(w=>w.length>=3&&!STOP.has(w));
// Scoring uses only profile facts: skills, profile/portfolio text, rate, years, rating.
// Name, location, photo and other personal attributes are never read here (PRD 7.5).
function score(f,p){
 const fs=new Set(f.skills.map(nk));
 const matched=p.skills.filter(s=>fs.has(nk(s))),missing=p.skills.filter(s=>!fs.has(nk(s)));
 const cov=p.skills.length?matched.length/p.skills.length:0;
 const A=new Set(tok(p.title+' '+p.desc+' '+p.skills.join(' ')));
 const B=new Set(tok(f.title+' '+f.bio+' '+f.skills.join(' ')+' '+f.port.map(x=>x.t+' '+x.d).join(' ')));
 const shared=[...A].filter(w=>B.has(w));
 const cos=A.size&&B.size?shared.length/Math.sqrt(A.size*B.size):0;
 const text=Math.min(1,cos/0.3);
 const target=p.type==='hourly'?p.rateMax:p.budget/p.hours,over=(f.rate-target)/target;
 const budget=over<=0?1:Math.max(0,1-over*1.25);
 const exp=Math.min(f.years,10)/10;
 const rating=f.rating?f.rating/5:0.7;
 const parts={skills:cov,text,budget,exp,rating};
 const total=Math.round(100*Object.keys(W).reduce((a,k)=>a+W[k]*parts[k],0));
 const why=!f.available?'Not available for new work':!matched.length?'No required skills':'';
 // best-matching portfolio item (grounded in profile)
 let port=null,pb=1;f.port.forEach(x=>{const n=tok(x.t+' '+x.d).filter(w=>A.has(w)).length;if(n>pb){pb=n;port=x}});
 return {f,p,total,parts,matched,missing,target,shared,port,eligible:!why,why};
}
function rankFor(p){const all=D.fl.map(f=>score(f,p));return{list:all.filter(m=>m.eligible).sort((a,b)=>b.total-a.total||(b.f.rating||0)-(a.f.rating||0)),hidden:all.filter(m=>!m.eligible)}}
function rankProjectsFor(f){return D.pr.filter(p=>p.status==='open').map(p=>score(f,p)).filter(m=>m.matched.length).sort((a,b)=>b.total-a.total)}
const tier=s=>s>=80?['Top match','t1']:s>=65?['Strong match','t2']:s>=50?['Good match','t3']:['Partial match','t4'];
const ring=(s,cls='')=>`<div class="ring ${cls} ${tier(s)[1]}" style="--v:${s}" aria-label="Match score ${s} out of 100"><span>${s}</span></div>`;
const spill=s=>`<span class="spill ${tier(s)[1]}" title="${tier(s)[0]}"><i>${s}</i>${tier(s)[0]}</span>`;
const andList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const list3=a=>a.length<=3?a.join(', '):a.slice(0,3).join(', ')+' +'+(a.length-3);
// "Explanation" layer: grounded template text built only from score parts and profile facts.
function reasonClient(m){
 const {f,p,matched}=m;
 let s=`Covers ${matched.length} of ${p.skills.length} required skills${matched.length?' ('+list3(matched)+')':''}. `;
 s+=budPhrase(m,false);
 s+=`, ${f.years} yr${f.years===1?'':'s'} experience`+(f.rating?`, ${f.rating.toFixed(1)}★ over ${f.jobs} jobs.`:', no ratings yet.');
 if(m.port)s+=` Built “${m.port.t}”.`;
 return s;
}
function reasonFree(m){
 const {p,matched,missing}=m;
 let s=`You have ${matched.length} of ${p.skills.length} skills they need`+(missing.length?` (missing ${list3(missing)})`:'')+'. ';
 s+=budPhrase(m,true)+'.';
 if(m.port)s+=` Mention your “${m.port.t}” project.`;
 return s;
}
function breakdown(m){
 const d={skills:`${m.matched.length} of ${m.p.skills.length} required skills`,text:m.shared.length?`Shared terms: ${m.shared.slice(0,6).join(', ')}`:'Little overlap with profile text',budget:m.p.type==='hourly'?`$${m.f.rate}/hr vs their $${m.p.rateMin}–$${m.p.rateMax}/hr range`:`$${m.f.rate}/hr vs ~$${Math.round(m.target)}/hr (budget ÷ hours)`,exp:`${m.f.years} yrs (capped at 10)`,rating:m.f.rating?`${m.f.rating.toFixed(1)}★ average`:'No ratings yet, scored neutral'};
 return `<div class="bd">${Object.keys(W).map(k=>`<div class="bd-row"><div><b>${WL[k]}</b> <span class="mute xs">weight ${Math.round(W[k]*100)}%</span><div class="mute xs">${esc(d[k])}</div></div><div class="bar"><i style="width:${Math.round(m.parts[k]*100)}%"></i></div><div class="bd-pts">${(m.parts[k]*Math.round(W[k]*100)).toFixed(1)}<span class="mute xs"> / ${Math.round(W[k]*100)}</span></div></div>`).join('')}<div class="bd-tot">Match score <b>${m.total}</b> / 100</div></div>`;
}
function budPhrase(m,you){
 const f=m.f,p=m.p,yr=you?'their':'your',Y=you?'Your ':'';
 if(p.type==='hourly'){if(f.rate>p.rateMax)return `${Y}$${f.rate}/hr is ${Math.round((f.rate/p.rateMax-1)*100)}% above ${yr} $${p.rateMax}/hr max`;return `${Y}$${f.rate}/hr is ${f.rate<p.rateMin?'below':'within'} ${yr} $${p.rateMin}–$${p.rateMax}/hr range`}
 const t=Math.round(m.target);return f.rate<=m.target?`${Y}$${f.rate}/hr fits ${yr} ~$${t}/hr budget`:`${Y}$${f.rate}/hr is ${Math.round((f.rate/m.target-1)*100)}% above ${yr} ~$${t}/hr budget`;
}

const skillChips=m=>m.matched.map(s=>`<span class="chip ok">✓ ${esc(s)}</span>`).join('')+m.missing.map(s=>`<span class="chip miss" title="Missing skill">✕ ${esc(s)}</span>`).join('');

/* skill detection (PRD 6.1) */
const KW=[[/\bmobile|\bios\b|\bandroid|\biphone/,['Flutter']],[/chat ?bot|\bai\b|\bgpt|\bllm|language model|\bassistant/,['LLM']],[/\bwebsite|\bweb ?app|\blanding page/,['React']],[/\bstore\b|\bshopify|e-?commerce/,['Shopify']],[/\bpayment|\bcheckout|\bsubscription/,['Stripe']],[/\bbackend|\bapi\b|\baccounts?\b|\blogin/,['Node.js','Firebase']],[/\blogo|\bbrand(ing| kit)/,['Branding']],[/\bdesign|\bui\b|\bux\b|\binterface/,['UI Design']],[/\bblog|\bseo\b|\bcopy\b/,['SEO','Copywriting']],[/\bdatabase|\bsql\b/,['PostgreSQL']],[/\brecommend|\bpredict|machine learning|\bml\b/,['Machine Learning']],[/\bdashboard|\banalytics/,['React','Data Analysis']],[/\bpython\b/,['Python']],[/\brag\b|help (center|articles)|knowledge base/,['NLP']]];
const allSkills=()=>[...new Set(D.fl.flatMap(f=>f.skills))].sort();
function detect(text){
 const t=String(text).toLowerCase(),out=[];
 KW.forEach(([re,sk])=>{if(re.test(t))out.push(...sk)});
 allSkills().forEach(s=>{const re=new RegExp('(^|[^a-z0-9])'+s.toLowerCase().replace(/[.+#*?()[\]\\/]/g,'\\$&')+'($|[^a-z0-9])');if(re.test(t))out.push(s)});
 const seen=new Set(),res=[];out.forEach(s=>{const k=nk(s);if(!seen.has(k)){seen.add(k);res.push(s)}});return res.slice(0,6);
}

function simulateProposals(pid){

 picks.forEach((m,i)=>setTimeout(()=>{
  const p2=pj(pid);if(!p2||p2.status!=='open'||propOf(pid,m.f.id))return;
  const f=m.f,bid=p.type==='hourly'?Math.min(f.rate,p.rateMax):Math.round(Math.min(p.budget*1.1,f.rate*p.hours)/50)*50,days=Math.max(5,Math.ceil(p.hours/Math.max(10,f.hpw)*7));
  const ans=(p.questions||[]).map(()=>m.port?`My “${m.port.t}” project is the closest example: ${m.port.d}`:`I've done similar work with ${andList(m.matched)}.`);
  const q={id:'q'+(++D.seq),pid,fid:f.id,cover:`Hi! I'm a ${f.title} with ${f.years} years of experience. I've worked with ${andList(m.matched)}${m.port?`, most recently on “${m.port.t}”`:''}. I can start this week and share progress every few days.`,bid,days,status:'submitted',ts:NOW(),answers:ans,links:[]};
  D.props.push(q);

  notify('c',`New proposal from ${f.name} on “${p.title}”`,'#/proposals/'+pid);
  save();toast(`New proposal from ${f.name} on “${p.title}”`);soft();
 },6000+i*7000));
}

function openPropose(pid){

 const bid=edit?ex.bid:hourly?Math.min(f.rate,p.rateMax):(Math.round(Math.min(p.budget,f.rate*p.hours)/50)*50||p.budget);
 const days=edit?ex.days:Math.max(5,Math.ceil(p.hours/Math.max(10,f.hpw||30)*7));
 openSheet(sheetH(edit?'Edit your proposal':'Submit a proposal',`${esc(p.title)} · ${esc(cname(p))} · ${hourly?`$${p.rateMin}–$${p.rateMax}/hr`:'budget '+money(p.budget)}`)+`

function bidHint(pid){const p=pj(pid),b=+$('#pp_bid')?.value,el=$('#pp_hint');if(!el)return;if(!(b>0)){el.innerHTML='';return}const ref=bidRef(p),d=Math.round((b/ref-1)*100),what=p.type==='hourly'?`max rate of $${ref}/hr`:`${money(ref)} budget`;el.innerHTML=`<div class="hint">Your ${p.type==='hourly'?'rate':'bid'} is <b>${d===0?'equal to':Math.abs(d)+'% '+(d>0?'over':'under')}</b> the client's ${what}.${d>15?' Bids far above budget are less likely to be accepted.':''}</div>`}
function draftCover(pid){
 const p=pj(pid),f=fl(D.ui.fid),m=score(f,p);
 $('#pp_cover').value=`Hi! I'm ${f.name.split(' ')[0]}, a ${f.title} with ${f.years} year${f.years===1?'':'s'} of experience.\n\nYour project needs ${andList(p.skills)}. I work with ${m.matched.length?andList(m.matched):'related tools'} every day${m.port?`, and recently built “${m.port.t}”: ${m.port.d.replace(/\.$/,'')}`:''}.${m.missing.length?`\n\nFor ${andList(m.missing)}, I'd ramp up quickly or bring in a trusted collaborator.`:''}\n\nI'd start with a short kickoff call to agree on scope, then share progress every few days. Happy to answer any questions!`;

function submitProposal(pid){
 const f=fl(D.ui.fid),p=pj(pid),ex=propOf(pid,f.id),edit=!!ex&&['submitted','shortlisted'].includes(ex.status);
 const cover=$('#pp_cover').value.trim(),bid=+$('#pp_bid').value,days=+$('#pp_days').value;
 const answers=(p.questions||[]).map((q,i)=>($('#pp_a'+i)?.value||'').trim());
 const links=($('#pp_links').value||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5);
 if(cover.length<20)return toast('Write a short cover letter (or use the draft)'),$('#pp_cover').focus();
 const miss=answers.findIndex(a=>!a);if(miss>=0)return toast("Answer the client's questions"),$('#pp_a'+miss).focus();
 if(!(bid>0))return toast('Enter a bid'),$('#pp_bid').focus();if(!(days>0))return toast('Enter delivery time'),$('#pp_days').focus();
 if(ex&&!edit)return toast('You already applied to this project');
 if(edit){
  Object.assign(ex,{cover,bid,days,answers,links,edited:NOW()});
  sysMsg(pid,f.id,`${f.name} updated their proposal: ${bidTxt(ex,p)} · ${days} days`);
  notifyClient(p,`${f.name} updated their proposal on “${p.title}”`,'#/proposals/'+pid);
  save();closeSheet();toast('Proposal updated');soft();return;
 }
 const cost=invited(pid,f.id)?0:connCost(p);
 if(f.connects<cost)return toast('Not enough Connects');
 f.connects-=cost;
 const q={id:'q'+(++D.seq),pid,fid:f.id,cover,bid,days,status:'submitted',ts:NOW(),answers,links,connects:cost};
 D.props.push(q);
 ensureThread(pid,f.id).msgs.push({f:'s',t:`${f.name} submitted a proposal: ${bidTxt(q,p)} · ${days} days`,ts:NOW()});
 notifyClient(p,`New proposal from ${f.name} on “${p.title}”`,'#/proposals/'+pid);
 logEv('proposal',pid,f.id);save();closeSheet();toast(`Proposal sent to ${cname(p)}${cost?` · ${cost} Connects used`:''}`);soft();
}

/* ============ OFFERS, CONTRACTS, MILESTONES, REVIEWS ============ */
const bidRef=p=>p.type==='hourly'?p.rateMax:p.budget;
const bidTxt=(q,p)=>p.type==='hourly'?`$${q.bid}/hr`:money(q.bid);
const safeUrl=u=>{u=String(u).trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?esc(x.href):'#'}catch(e){return '#'}};
const fts=ts=>new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const notifyClient=(p,t,l)=>{if(p.owner==='me')notify('c',t,l)};
const offerFor=qid=>D.offers.find(o=>o.qid===qid&&o.status==='pending');
const pendingOffer=pid=>D.offers.find(o=>o.pid===pid&&o.status==='pending');
const contractOf=pid=>D.contracts.find(c=>c.pid===pid);
const revOf=(cid,dir)=>D.reviews.find(r=>r.cid===cid&&r.dir===dir);
const msTotal=x=>x.ms.reduce((a,m)=>a+(+m.amt||0),0);
const termsTxt=x=>x.type==='hourly'?`<b>$${x.rate}/hr</b> · up to ${x.limit} hrs/week`:`Fixed price <b>${money(msTotal(x))}</b> · ${x.ms.length} milestone${x.ms.length>1?'s':''}`;
const pstat=p=>{const po=pendingOffer(p.id);return p.status==='hired'?'<b style="color:var(--brand)">In progress with '+esc(fl(p.hired)?.name||'')+'</b>':p.status==='ended'?'<b>Completed</b>':po?'Open · offer sent to '+esc(fl(po.fid).name):'Open'};
const myContracts=()=>D.contracts.filter(c=>D.ui.role==='client'?pj(c.pid)?.owner==='me':c.fid===D.ui.fid).sort((a,b)=>b.ts-a.ts);
const myOffers=()=>D.offers.filter(o=>o.status==='pending'&&(D.ui.role==='client'?pj(o.pid)?.owner==='me':o.fid===D.ui.fid));

function openOffer(qid){
 const q=D.props.find(x=>x.id===qid),p=pj(q.pid),f=fl(q.fid);
 if(pendingOffer(p.id))return toast('You already have an offer out on this project');
 const a=Math.round(q.bid*0.4/50)*50;
 S.offer={qid,msg:`Hi ${f.name.split(' ')[0]}, we'd love to work with you on “${p.title}”. Here's our offer.`,ms:p.type==='fixed'?(q.bid<1000?[{t:'Complete project',amt:q.bid,due:isoIn(q.days)}]:[{t:'First milestone',amt:a,due:isoIn(Math.ceil(q.days/2))},{t:'Final delivery',amt:q.bid-a,due:isoIn(q.days)}]):[],rate:q.bid,limit:Math.min(40,f.hpw||20)};
 offerSheet();

 const O=S.offer,q=D.props.find(x=>x.id===O.qid),p=pj(q.pid),f=fl(q.fid),hourly=p.type==='hourly';
 openSheet(sheetH(`Send an offer to ${esc(f.name)}`,`for “${esc(p.title)}” · their ${hourly?'rate':'bid'}: ${bidTxt(q,p)}`)+`
 ${hourly?`<div class="grid2"><label>Hourly rate (USD)<input id="of_rate" type="number" min="1" value="${O.rate}" oninput="S.offer.rate=+this.value"></label><label>Weekly limit (hours)<input id="of_lim" type="number" min="1" value="${O.limit}" oninput="S.offer.limit=+this.value"></label></div>`
 :`<div class="lbl">Milestones <span class="mute sm" style="font-weight:400">split the work into parts the freelancer delivers one by one</span></div>
 ${O.ms.map((x,i)=>`<div class="mrow"><input value="${esc(x.t)}" aria-label="Milestone ${i+1} name" oninput="S.offer.ms[${i}].t=this.value"><input type="number" min="1" value="${x.amt}" aria-label="Milestone ${i+1} amount" oninput="S.offer.ms[${i}].amt=+this.value;ofTotal()"><input type="date" value="${x.due}" aria-label="Milestone ${i+1} due date" oninput="S.offer.ms[${i}].due=this.value">${O.ms.length>1?`<button class="x" type="button" onclick="S.offer.ms.splice(${i},1);offerSheet()" aria-label="Remove milestone ${i+1}">×</button>`:'<span></span>'}</div>`).join('')}
 ${O.ms.length<5?`<button class="btn plain sm" type="button" onclick="S.offer.ms.push({t:'Milestone ${O.ms.length+1}',amt:0,due:isoIn(21)});offerSheet()">+ Add milestone</button>`:''}
 <div id="of_total" style="margin-top:12px"></div>`}
 <label>Message<textarea id="of_msg" rows="3" oninput="S.offer.msg=this.value">${esc(O.msg)}</textarea></label>
 <p class="mute xs">No money moves in this demo. Payments and escrow are out of scope, so milestones only track the work.</p>

function ofTotal(){const el=$('#of_total');if(!el)return;const q=D.props.find(x=>x.id===S.offer.qid),t=S.offer.ms.reduce((a,x)=>a+(+x.amt||0),0),d=t-q.bid;el.innerHTML=`<div class="hint" style="margin:0">Total <b>${money(t)}</b>${d?` · ${money(Math.abs(d))} ${d>0?'above':'below'} their ${money(q.bid)} bid`:' · matches their bid'}</div>`}
function sendOffer(){
 const O=S.offer,q=D.props.find(x=>x.id===O.qid),p=pj(q.pid),f=fl(q.fid),hourly=p.type==='hourly';
 if(hourly){if(!(O.rate>0))return toast('Enter an hourly rate');if(!(O.limit>0))return toast('Enter a weekly limit')}
 else{const bad=O.ms.findIndex(x=>!x.t.trim()||!(x.amt>0)||!x.due);if(bad>=0)return toast(`Milestone ${bad+1} needs a name, amount and due date`)}
 if(pendingOffer(p.id))return toast('You already have an offer out on this project');
 const o={id:'o'+(++D.seq),pid:p.id,fid:f.id,qid:q.id,type:p.type,ms:hourly?[]:O.ms.map(x=>({t:x.t.trim(),amt:+x.amt,due:x.due})),rate:hourly?O.rate:null,limit:hourly?O.limit:null,msg:(O.msg||'').trim(),status:'pending',ts:NOW()};
 D.offers.push(o);
 const th=ensureThread(p.id,f.id);th.msgs.push({f:'s',t:`Pulse Fit sent an offer: ${hourly?`$${o.rate}/hr, up to ${o.limit} hrs/week`:`${money(msTotal(o))} in ${o.ms.length} milestone${o.ms.length>1?'s':''}`}`,ts:NOW()});
 if(o.msg)th.msgs.push({f:'c',t:o.msg,ts:NOW()+1});th.read.c=NOW()+1;
 notify(f.id,`Pulse Fit sent you an offer for “${p.title}”`,'#/offer/'+o.id);logEv('offer',p.id,f.id);

function withdrawOffer(oid){const o=D.offers.find(x=>x.id===oid),p=pj(o.pid),f=fl(o.fid);o.status='withdrawn';sysMsg(o.pid,o.fid,'Pulse Fit withdrew the offer');notify(f.id,`Pulse Fit withdrew their offer for “${p.title}”`,'#/project/'+p.id);save();toast('Offer withdrawn');soft()}
function acceptOffer(oid){
 const o=D.offers.find(x=>x.id===oid),p=pj(o.pid),f=fl(o.fid),q=D.props.find(x=>x.id===o.qid);
 if(o.status!=='pending'||p.status!=='open')return toast('This offer is no longer available');
 o.status='accepted';if(q)q.status='accepted';p.status='hired';p.hired=f.id;
 const c={id:'c'+(++D.seq),pid:p.id,fid:f.id,oid,type:o.type,ms:o.ms.map((x,i)=>({...x,st:i===0?'active':'pending'})),rate:o.rate,limit:o.limit,status:'active',ts:NOW()};
 D.contracts.push(c);
 sysMsg(p.id,f.id,`🎉 ${f.name} accepted the offer. Contract started.`);
 notifyClient(p,`${f.name} accepted your offer for “${p.title}”`,'#/contract/'+c.id);logEv('hire',p.id,f.id);

 if(f.port.length<2)t.push('Add portfolio items. Their text feeds the similarity signal (20%).');
 const over=ranked.slice(0,5).filter(m=>m.f.rate>m.target).length;
 if(over)t.push(`Your rate is above budget on ${over} of your top 5 matches. Budget fit is 20% of the score.`);
 if(!t.length)t.push('Your profile is in great shape. Keep your availability up to date.');
 return t;
}

/* ============ MY PROFILE (create / edit) ============ */
function vMe(){
 if(!S.me){const f=fl(D.ui.fid);S.me=JSON.parse(JSON.stringify(f));S.me.isNew=false}
 const d=S.me;
 return `<div class="wrap narrow page"><div class="ph"><div><h1>${d.isNew?'Create your freelancer profile':'Edit profile'}</h1><p class="mute">Clients only see facts from your profile in match reasons. Your name and location are never used for scoring.</p></div></div>
 <div class="card">
 <div class="grid2"><label>Display name<input id="me_name" value="${esc(d.name)}" placeholder="e.g. Sam T."></label><label>Professional title<input id="me_title" value="${esc(d.title)}" placeholder="e.g. Flutter developer"></label></div>
 <div class="lbl">Skills</div><div class="skillbox" onclick="$('#me_skill').focus()"><span id="meskills" class="chips">${d.skills.map((s,i)=>`<span class="chip ok">${esc(s)}<button onclick="event.stopPropagation();S.me.skills.splice(${i},1);keepMe()" aria-label="Remove ${esc(s)}">×</button></span>`).join('')}</span><input id="me_skill" list="allsk2" placeholder="Type a skill, press Enter" onkeydown="if(event.key==='Enter'||event.key===','){event.preventDefault();meSkill(this.value)}"></div>
 <datalist id="allsk2">${allSkills().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
 <div class="grid3" style="margin-top:14px"><label>Hourly rate (USD)<input id="me_rate" type="number" min="5" value="${esc(d.rate)}"></label><label>Years of experience<input id="me_years" type="number" min="0" value="${esc(d.years)}"></label><label>Hours per week<input id="me_hpw" type="number" min="0" value="${esc(d.hpw)}"></label></div>
 <label>Location <span class="mute sm" style="font-weight:400">(shown on your profile, never scored)</span><input id="me_loc" value="${esc(d.loc)}"></label>
 <label>Bio<textarea id="me_bio" rows="4" placeholder="What do you build, and for whom?">${esc(d.bio)}</textarea></label>
 <label class="row" style="gap:8px;font-weight:500"><input id="me_av" type="checkbox" style="width:auto;margin:0" ${d.available?'checked':''}> Available for new projects</label>
 <div class="lbl" style="margin-top:6px">Portfolio</div>
 <div class="plist" style="margin-bottom:10px">${d.port.map((x,i)=>`<div class="pitem" style="cursor:default"><span class="grow"><b>${esc(x.t)}</b><br><span class="mute sm">${esc(x.d)}</span></span><button class="btn danger sm" onclick="S.me.port.splice(${i},1);keepMe()">Remove</button></div>`).join('')||'<span class="mute sm">No items yet.</span>'}</div>
 <div class="grid2"><input id="pt_t" placeholder="Project name"><input id="pt_d" placeholder="One line on what you built"></div>
 <button class="btn ghost sm" style="margin:10px 0 18px" onclick="addPort()">+ Add portfolio item</button>
 ${['emp','edu','cert','lang'].map(plistEd).join('')}
 <div style="height:18px"></div>
 <div class="row end"><button class="btn plain" onclick="S.me=null;go(${d.isNew?"'#/'":"'#/dashboard'"})">Cancel</button><button class="btn" onclick="saveMe()">${d.isNew?'Create profile & see matches':'Save profile'}</button></div></div></div>`;
}
const PLISTS={
 emp:{label:'Employment history',f:[['role','Role'],['co','Company'],['from','From (year)'],['to','To (year or Present)']],cols:'1.3fr 1.3fr 110px 150px 40px',show:x=>`<b>${esc(x.role)}</b> · ${esc(x.co)} <span class="mute">${esc(x.from)}–${esc(x.to)}</span>`},
 edu:{label:'Education',f:[['school','School'],['deg','Degree'],['yr','Year']],cols:'1.4fr 1.4fr 90px 40px',show:x=>`<b>${esc(x.school)}</b> · ${esc(x.deg)} <span class="mute">${esc(x.yr)}</span>`},
 cert:{label:'Certifications',f:[['name','Certification'],['by','Issuer'],['yr','Year']],cols:'1.4fr 1.2fr 90px 40px',show:x=>`<b>${esc(x.name)}</b> · ${esc(x.by)} <span class="mute">${esc(x.yr)}</span>`},
 lang:{label:'Languages',f:[['l','Language'],['lv','Level, e.g. Fluent']],cols:'1fr 1fr 40px',show:x=>`<b>${esc(x.l)}</b> <span class="mute">${esc(x.lv)}</span>`}};
function plistEd(k){
 const L=PLISTS[k],items=S.me[k]||[];
 return `<div class="lbl" style="margin-top:14px">${L.label}</div>
 ${items.map((x,i)=>`<div class="row between sm" style="padding:7px 0;border-top:1px solid var(--line);flex-wrap:nowrap"><span>${L.show(x)}</span><button class="link sm" style="color:var(--red)" onclick="S.me.${k}.splice(${i},1);keepMe()">Remove</button></div>`).join('')}
 <div class="lrow" style="grid-template-columns:${L.cols};margin-top:6px">${L.f.map(([fk,lab])=>`<input id="pl_${k}_${fk}" placeholder="${lab}" aria-label="${L.label}: ${lab}">`).join('')}<button class="btn plain sm" type="button" onclick="addPl('${k}')" aria-label="Add to ${L.label}">+</button></div>`;
}
function addPl(k){const L=PLISTS[k],o={};L.f.forEach(([fk])=>o[fk]=($('#pl_'+k+'_'+fk).value||'').trim());if(!o[L.f[0][0]])return toast(`Add the ${L.f[0][1].toLowerCase()} first`);if(k==='emp'&&!o.to)o.to='Present';(S.me[k]=S.me[k]||[]).push(o);keepMe()}
function readMe(){const d=S.me;d.name=$('#me_name').value.trim();d.title=$('#me_title').value.trim();d.rate=+$('#me_rate').value;d.years=+$('#me_years').value;d.hpw=+$('#me_hpw').value;d.loc=$('#me_loc').value.trim();d.bio=$('#me_bio').value.trim();d.available=$('#me_av').checked}
function keepMe(){readMe();S.me.keep=true;const y=scrollY;render();scrollTo(0,y)}
function meSkill(v){v=v.trim().replace(/,$/,'');if(!v)return;const k=allSkills().find(s=>nk(s)===nk(v));v=k||v;if(!S.me.skills.some(s=>nk(s)===nk(v)))S.me.skills.push(v);keepMe();setTimeout(()=>$('#me_skill')?.focus(),0)}
function addPort(){const t=$('#pt_t').value.trim(),d=$('#pt_d').value.trim();if(!t)return toast('Add a project name');S.me.port.push({t,d});keepMe()}
function saveMe(){
 readMe();const d=S.me;if($('#me_skill').value.trim()){meSkill($('#me_skill').value);readMe()}
 if(!d.name||!d.title)return toast('Add your name and title');if(!d.skills.length)return toast('Add at least one skill');if(!(d.rate>0))return toast('Add your hourly rate');
 const clean={name:d.name,title:d.title,skills:d.skills,rate:d.rate,years:Math.max(0,d.years||0),hpw:d.hpw||0,loc:d.loc,bio:d.bio||d.title,available:d.available,port:d.port,emp:d.emp||[],edu:d.edu||[],cert:d.cert||[],lang:d.lang||[]};
 if(d.isNew){const f={id:++D.seq,rating:null,jobs:0,jss:null,connects:40,...clean};D.fl.push(f);D.ui.fid=f.id;D.ui.role='freelancer';toast('Profile created. Here are your matches.')}
 else{Object.assign(fl(D.ui.fid),clean);toast('Profile saved. Match scores updated.')}
 save();S.me=null;go('#/dashboard');
}

/* ============ CHAT ============ */
function vChat(key){
 const ts=myThreads(),t=key?D.th[key]:null,s=side();
 if(t&&!ts.includes(t))return notFound('Conversation not found for this view. Switch roles to see it.');
 if(t){t.read[s]=NOW();save();setTimeout(hdr,0)}
 const other=t=>s==='c'?fl(t.fid).name:pj(t.pid).client.replace(' (you)','');
 const lastText=t=>{const m=[...t.msgs].reverse().find(x=>x.f!=='s')||t.msgs[t.msgs.length-1];return m?(m.f===s?'You: ':'')+m.t:''};
 return `<div class="wrap page"><h1 style="margin-bottom:14px">Messages</h1>
 <div class="chat ${t?'has':''}"><div class="tlist">${ts.length?ts.map(x=>{const f=fl(x.fid),u=unread(x);return `<a class="titem ${x===t?'on':''}" href="#/chat/${tkey(x.pid,x.fid)}">${s==='c'?av(f,38):`<span class="av" style="width:38px;height:38px;background:#2b3a33;font-size:14px">${esc(pj(x.pid).client[0])}</span>`}<div class="tx"><div class="row between" style="flex-wrap:nowrap"><b class="sm">${esc(other(x))}</b><span class="xs mute">${ago(lastTs(x))}</span></div><div class="xs mute" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pj(x.pid).title)}</div><div class="last">${esc(lastText(x))}</div></div>${u?'<span class="dot" aria-label="unread"></span>':''}</a>`}).join(''):`<div class="empty sm">No conversations yet.<br>${s==='c'?'Invite a freelancer from your matches to start one.':'Threads open when a client invites you or you send a proposal.'}</div>`}</div>
 <div class="conv">${t?convo(t,s):'<div class="empty" style="margin:auto"><h3>Select a conversation</h3><p>One thread per project and freelancer.</p></div>'}</div></div></div>`;
}
function convo(t,s){
 const f=fl(t.fid),p=pj(t.pid),m=score(f,p),pr=propOf(t.pid,t.fid),k=tkey(t.pid,t.fid);
 return `<div class="conv-h"><button class="link chat-back" onclick="go('#/chat')" aria-label="Back to conversations">←</button>${s==='c'?av(f,36):''}<div class="grow" style="min-width:0"><b>${s==='c'?`<a href="#/profile/${f.id}" style="color:inherit">${esc(f.name)}</a>`:esc(p.client.replace(' (you)',''))}</b> <span class="mute sm">· <a href="${s==='c'?'#/matches/'+p.id:'#/project/'+p.id}">${esc(p.title)}</a></span><div class="row xs" style="gap:6px;margin-top:2px">${spill(m.total)}${pr?`<span class="pill st-${pr.status}">Proposal ${pr.status}</span>`:''}</div></div>
 ${s==='c'&&pr?`<button class="btn ghost sm" onclick="go('#/proposals/${p.id}')">Compare</button>`:''}${s==='f'&&!pr&&p.status==='open'?`<button class="btn sm" onclick="go('#/project/${p.id}');setTimeout(()=>openPropose('${p.id}'),50)">Send proposal</button>`:''}</div>
 <div class="msgs">${t.msgs.map(x=>x.f==='s'?`<div class="msg sys">${esc(x.t)} · ${hhmm(x.ts)}</div>`:`<div class="msg ${x.f===s?'me':'them'}">${esc(x.t)}<time>${hhmm(x.ts)}</time></div>`).join('')}${S.typing[k]&&S.typing[k]!==s?`<div class="typing">${esc(s==='c'?f.name:p.client.replace(' (you)',''))} is typing…</div>`:''}</div>
 <form class="composer" onsubmit="event.preventDefault();sendMsg('${k}')"><textarea id="cmp" rows="1" placeholder="Write a message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg('${k}')}" aria-label="Message"></textarea><button class="btn">Send</button></form>`;
}
function sendMsg(k){
 const el=$('#cmp'),v=el.value.trim();if(!v)return;
 const t=D.th[k],s=side();t.msgs.push({f:s,t:v,ts:NOW()});t.read[s]=NOW();save();el.value='';
 render();$('#cmp')?.focus();autoReply(k,s);
}
// Demo-only: the other side replies once per thread so a conversation can be shown solo
function autoReply(k,from){
 const t=D.th[k],to=from==='c'?'f':'c';if(t.auto[to])return;t.auto[to]=true;save();
 const f=fl(t.fid),p=pj(t.pid),m=score(f,p);
 setTimeout(()=>{S.typing[k]=to;if(route().id===k)soft()},700);
 setTimeout(()=>{
  delete S.typing[k];
  const txt=to==='f'?`Thanks for reaching out! “${p.title}” looks like a great fit. I've worked with ${andList(m.matched)}${m.port?` and built “${m.port.t}”`:''}. I'll send a proposal with a timeline today. Any must-have features for the first version?`
   :`Thanks ${f.name.split(' ')[0]}! Appreciate the quick reply. Could you share a rough plan for the first two weeks and how you'd handle ${m.missing.length?andList(m.missing):'testing and launch'}?`;
  t.msgs.push({f:to,t:txt,ts:NOW()});save();
  const viewing=route().r==='chat'&&route().id===k&&side()===from;
  soft();if(!viewing)toast('New message from '+(to==='f'?f.name:p.client.replace(' (you)','')));
 },2400);
}
function notFound(msg){return `<div class="wrap page"><div class="card empty"><h3>${esc(msg)}</h3><button class="btn" onclick="go('#/')">Go home</button></div></div>`}

/* ============ boot ============ */
load();
window.addEventListener('hashchange',render);
render();
</script>
